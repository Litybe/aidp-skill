version: 5
id: art-import
description: >
  Gamedev route `art`, test step (replaces the Unity playtest): proves that a
  pixel art asset of the PR works in Unity. Checks the .meta of every sprite
  (16 pixels per unit, filter Point, no mipmap, compression none, sprite mode
  and pivot as the project profile says; fixes them in the .meta text when
  the importer does not already apply them) and runs the compile gate over the
  file bridge (contract C1, templates/recipes/unity-verify.md). Scene placement
  and Play Mode captures only run when the Unity MCP is available.

  The Unity Editor is held by the user: the flow step that runs this pipeline
  carries `resource: unity-editor` (contract C3; the lock is a flow concern,
  not a stage field). Without
  the Editor the run reports `blocked: unity-editor`. The test
  scene is a scratch one under Assets/Tests/Playtest/, never a gameplay
  scene, and is not part of the PR unless the issue asks for it.

  Outputs read by the flow (contract C4): result.json {passed, report} and
  the Markdown report report.md, with the captures, in the stage dir.
inputs:
  issue: { required: false, kind: string, default: "", description: "GitHub issue number; its linked PR holds the asset." }
  pr: { required: false, kind: string, default: "", description: "PR number. Empty: the PR linked to `issue`, else the open PR of the current branch." }
  scene: { required: false, kind: string, default: "Assets/Tests/Playtest/ArtImport.unity", description: "Scratch test scene where the sprite is placed." }
  feature: { required: false, kind: string, description: "Ticket label; names the vault run folder." }
settings:
  knowledge_graph:
    enabled: false
stages:
  - name: prepare
    agent: executor
    model: haiku
    scope: { mode: stage_dir_only }
    policy:
      - "Never ask the user a question. Decide open points yourself and record them as assumptions."
      - "Read only: no commit, no push, no branch switch, no GitHub write."
    inputs:
      issue: "{{ inputs.issue }}"
      pr: "{{ inputs.pr }}"
    with:
      instructions: >
        (1) The working directory must hold Assets/ and ProjectSettings/;
        otherwise blocked. (2) The PR (`pr`, else the one linked to `issue`,
        else the open PR of the current branch; none: blocked) and its files
        (`rtk gh pr view <pr> --json number,files,headRefName`). The branch
        must be checked out in the working directory (the flow does it);
        otherwise blocked. (3) List the sprite assets of the PR (.png /
        .aseprite under Assets/), their .meta, and the animation clips or
        controllers when present, and read the asset requirements of the
        issue (names, tags, frame counts, ms). Write context.json: pr, issue,
        branch, sprites (list of {path, meta, tags, frames, expected}), clips.
        Memory (contract C10, templates/recipes/memory.md of the skill): with the issue number, run `rtk aidp memory context --project "<projectRoot>" --issue GH-<issue> --route art --stage import --budget 2000` (without an issue, drop `--issue`) and save its output as memory-context.md in your stage dir, unchanged; if the command fails, write memory-context.md holding only « Mémoire indisponible : <cause> » and go on. Read the BIBLE by its index (00_INDEX) and get any passage you need with `rtk aidp rag search "<query>" --project "<projectRoot>" --source bible --budget 1500`, never whole.
    outputs: [context.json, memory-context.md]

  - name: import
    agent: executor
    model: sonnet
    needs: [prepare]
    scope: { mode: repo_wide }
    policy:
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "Never ask the user a question. Drive the Editor through the file bridge; use the Unity MCP only if its tools are present; no computer use."
      - "Never edit a gameplay scene, prefab or script. Only the scratch test scene and the .meta of the PR's sprites may change; list every change in the report."
      - "Never commit or push, never switch branch. Leave the Editor in Edit Mode."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      scene: "{{ inputs.scene }}"
      task: >
        Headless session: the Unity MCP is not available, the channel is the
        file bridge (templates/recipes/unity-verify.md). (0) Check the Editor
        is open on projectRoot (unity-verify.md section 0); closed or another
        project: write import.json with blocked "unity-editor". (1) Compile
        gate C1 first: drop .aidp/compile/requests/<id>.json, read
        .aidp/compile/results/<id>.json; not ok: failed with the errors.
        (2) For each sprite of `context`: read its .meta as text and compare
        with what mcp__aseprite__project_profile / unity_validate require
        (16 pixels per unit, Point filter, no mipmaps, no compression, sprite
        mode and pivot). A wrong value is fixed by editing the .meta text
        (keep the guid) and noted; drop a new compile request so the Editor
        reimports it, then re-read the .meta. (3) Read the end of
        <projectRoot>/Logs/Editor.log for import errors or warnings about the
        sprites. (4) Scene placement and Play Mode captures need the Unity MCP:
        when its tools are absent, skip them and report played null with the
        reason "headless: no Unity MCP"; do not count that as a failure. The
        asset passes when the compile gate is ok, every .meta is ok and the log
        holds no error for it. Write import.json: compile {ok, errors,
        durationMs}, blocked (null or reason), sprites: per sprite {path, meta:
        {ppu, filter, mipmaps, compression, pivot, ok, fixed}, played (null or
        {tag, frames, ms, loops, ok}), captures, console}.
    outputs: [import.json]

  - name: report
    agent: executor
    model: haiku
    needs: [import]
    scope: { mode: stage_dir_only }
    policy:
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "Memory proposals: write memory-proposals.json (`{\"proposals\": []}` when nothing qualifies), 5 max, non-obvious reusable lessons only, as templates/recipes/memory.md §3 says."
      - "No GitHub write, no commit, no push."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      import: "{{ stages.import.outputs.import }}"
    with:
      instructions: >
        Write result.json: {"passed": <true only when the compile gate was ok,
        every sprite meta ok (after fix) and every animation played without
        console error>, "pr": <n>, "failed": [<short reasons>], "report":
        "report.md", "blocked": <reason or null>} (contract C9, flat object;
        mirror passed and report as signals of the reply envelope; status
        blocked: the reason goes in signals.blocked_reason). Write report.md: the
        compile gate result (errors, duration), a table per sprite (meta
        values, fixed or not, animation played, captures), the console, and
        the Editor changes made (meta fixes, scratch scene).
    outputs: [result.json, report.md, memory-proposals.json]
