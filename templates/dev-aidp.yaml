version: 5
id: dev-aidp
description: >
  Develop `aidp` ITSELF. Launch it from the aidp repository (D:\AIDP\src\aidp
  in the gamedev profile): the Rust workspace (crates under `crates/`), the
  JSON schemas under `schema/`, the frozen test skill under `fixtures/skill/`
  and the docs under `docs/`. The repository's rules are its `AGENTS.md`;
  every stage that reads or writes code follows them. The skill the binary
  drives (templates, agents, commands, SKILL.md) lives in its own repository
  at $AIDP_SKILL_ROOT (D:\AIDP\skill): this run reads it, never writes it.

  What makes it different from the game pipelines:
    * DEMAND is always plain text (`prompt`). No ticket stage at all.
    * The stack is Rust + JSON schemas + Markdown, so the checks that matter
      are `rtk cargo fmt/clippy/nextest` AND `rtk aidp validate --all` run with the
      binary built from this tree against the real skill - an emitter change
      that breaks a real template breaks every pipeline run, which no unit test
      catches.
    * The change usually spans several layers - crates, schema, fixtures, docs
      - so `implement` is plan-driven (one task per layer, file-disjoint) and
      its `merge_hint` runs the whole gauntlet once on the merged tree after
      the tasks land.

  Everything stays on D: (toolchain, target directories, caches). Tracks via
  track = quick | standard | deep: `quick` skips the design study, `deep`
  adds the four-axis review and its correction loop.
policy:
  - 'Read AGENTS.md at the repository root before the first change and follow it: code conventions, test layout, schema and golden rules, Conventional Commits.'
  - 'Nothing is installed or written on C:. RUSTUP_HOME, CARGO_HOME and the npm cache already point at D:\DevTools; never run rustup-init, cargo install or a download into the user profile.'
  - 'Every cargo command in this run (check, build, test, clippy, run) runs with CARGO_TARGET_DIR set to D:\AIDP\target-dev-aidp. Bash: export CARGO_TARGET_DIR="D:/AIDP/target-dev-aidp". PowerShell: $env:CARGO_TARGET_DIR = "D:\AIDP\target-dev-aidp". Set it before the first cargo call.'
  - 'Never run cargo clean or cargo build --release, and never copy anything into D:\AIDP\bin. The installed aidp is refreshed only by the user.'
  - 'While iterating, check with cargo check -p <crate> and test with cargo nextest run -p <crate>. Run the whole workspace once, at the end of the stage, and never two cargo commands at once.'
  - 'The skill (templates, agents, commands, SKILL.md) is read from $AIDP_SKILL_ROOT and never written by this run. A change the skill must follow is written down in plan.md as a follow-up for the skill repository.'
  - 'To check a change against the real skill, run the binary built from this tree with AIDP_SKILL_ROOT set: cargo run -p aidp-cli -- validate --all.'
inputs:
  # The request in plain text - "add a `retry:` field to stages", "make
  # knowledge-read cheaper", "document the plan_tasks contract".
  prompt: { required: true, kind: string, description: "Demande en langage naturel decrivant le changement a apporter a aidp (ex. \"ajouter un champ retry: aux stages\")." }
  # Names the branch (feat/<feature>), the vault folder and the PR. Required
  # because nothing else can derive it - there is no ticket list to fall back on.
  feature: { required: true, kind: string, description: "Nom de la feature : alimente run::feature_key (sa PREMIERE branche testee) - decide le nom de la branche git ET le dossier du vault Obsidian pour ce run." }
  track: { required: true, kind: enum, values: [quick, standard, deep], default: standard, description: "Profondeur du run : quick saute l'etude, standard fait l'etude, deep ajoute la revue quatre axes et sa boucle de correction." }
settings:
  knowledge:
    enabled: true
    route: tooling
  pr_draft: false
  max_correction_iterations: 2
  # One budget-guarded automatic retry per stage on a `status: "failed"`
  # dispatch, before hard-pausing - absorbs transport-level/transient failures
  # anywhere in the run, including the inlined `review` fragment's 4 axes and
  # synthesis stage (settings are the TOP-LEVEL pipeline's, applied to every
  # stage after composition expands `review` inline).
  max_stage_retries: 1
  knowledge_graph:
    enabled: true
    refresh: never
    code_only: true
stages:
  # Cut the feature branch off an up-to-date default branch first, so every
  # later stage's writes, commits and the PR land on feat/<feature>. Everything
  # below reads `needs` on it, so it runs alone, before the fan-out.
  - name: prepare_branch
    agent: executor
    model: haiku   # delibere : setup de branche mecanique, aucun raisonnement - haiku suffit
    inputs:
      branch: "feat/{{ feature }}"
      task: >
        From the repository root: run `rtk git status --porcelain`; if the
        working tree has changes this run did not make, reply `blocked` and
        name the files. Find the default branch (`main` when it exists, else
        `master`), switch to it and, only when it tracks a remote, run
        `rtk git pull --ff-only`. Then switch to `branch`, creating it from the
        default branch when it does not exist. Write branch.json with `branch`,
        `base` (the default branch) and `base_sha`.
    outputs: [branch.json]
    when: "true"

  # --- Step 0: what do we already know? The project knowledge base
  # (<vault>/Knowledge/<repo>/) is documentation accumulated by previous runs,
  # so reading it first means the layer read below only has to find what it
  # does not already answer.
  - name: knowledge
    type: pipeline
    uses: knowledge-read
    needs: [prepare_branch]
    with: { focus: "{{ feature }}" }
    outputs:
      - { name: knowledge_context, from: knowledge_read.knowledge_context }

  # Read-only read of the Rust workspace: what actually implements the
  # behaviour being changed - the emitter, the condition engine, the CLI, the
  # gateway. No `needs` on `knowledge`, so both run in one parallel() block.
  - name: read_rust
    agent: analyzer
    model: haiku   # delibere : lecture ciblee d'une couche, pas de synthese - haiku suffit
    skills: [graphify]
    needs: [prepare_branch]
    inputs:
      task: >
        Read the `aidp` Rust workspace (crates/aidp-core, aidp-cli,
        aidp-gateway, aidp-integrations, aidp-tickets, aidp-flows, aidp-agents)
        for everything that bears on this request: "{{ inputs.prompt }}". Name
        the crates, modules and functions that would have to change, the
        structs the pipeline YAML deserializes into, and where `workflow emit`
        turns a stage into a Workflow script call. When the request touches the
        template format, also read the real templates at
        $AIDP_SKILL_ROOT/templates that use it. Quote the exact type and
        function signatures you found - the plan will be written against them.
        Say explicitly what you could NOT find.
    outputs: [rust_context.md]

  # Synthesis: one context note the plan is written from.
  - name: discover
    agent: analyzer
    model: haiku   # delibere : fusion de deux lectures courtes - haiku suffit
    needs: [knowledge, read_rust]
    inputs:
      knowledge_context: "{{ stages.knowledge.outputs.knowledge_context }}"
      task: >
        Merge the knowledge-base digest and the Rust read into one context note
        for this request: "{{ inputs.prompt }}". State what the change is, the
        full set of files across crates, schemas, fixtures and docs that must
        move together, the backward compatibility constraint (which existing
        templates and which in-flight runs must keep working), and the open
        questions. Flag any place where the Rust behaviour and the documented
        behaviour already diverge - that is a bug to be aware of, not something
        to silently fix inside this change. Flag any place where
        `knowledge_context` itself already disagrees with what the read found -
        that is stale knowledge to correct, not a second source of truth.
    outputs: [context.md]

  # Design study - skipped on the quick track, where the change is small enough
  # that the plan is the design.
  - name: study
    agent: analyzer
    needs: [discover]
    when: "{{ inputs.track != 'quick' }}"
    inputs:
      task: >
        Write study.md for "{{ inputs.prompt }}" from context.md: the design
        options, their trade-offs against the constraints it lists (backward
        compatibility, the rules of AGENTS.md, the real templates of the skill),
        the option you recommend and why, the risks, and the tests that will
        prove the change.
    outputs: [study.md]

  # `plan.json` (schema/plan.schema.json) is the machine contract: one object per
  # task, each with its own prompt, `needs` and `files` write set. Slice by LAYER
  # here - the Rust change, the template/schema change, the doc change - because
  # those write sets are naturally disjoint and can run at the same time.
  # `plan.md` stays the human narrative.
  - name: plan
    agent: planner
    skills: [graphify]
    needs: [study]
    with: { mode: feature }
    inputs:
      task: >
        Write an executable plan for "{{ inputs.prompt }}". Slice the work into
        file-disjoint tasks by layer (Rust crates / schema and fixtures /
        docs), with `needs` only where a task genuinely reads another's
        output. Every Rust task must say which `rtk cargo test` it adds or extends,
        in the layout AGENTS.md requires; every schema task must say which test
        proves it; every behaviour change the driver can see must carry a docs
        task, and plan.md lists the SKILL.md or template change the skill
        repository needs as a follow-up. Never plan a change that breaks a real
        template of the skill.
    outputs: [plan.json, plan.md]

  # Plan-driven implementation: `aidp workflow emit` loads plan.json, validates
  # the task graph, serialises any two tasks that would write the same file, and
  # dispatches one sub-agent per task in the shared working tree. TWO-PASS: the
  # first emit stops here (`awaiting_plan`); re-emitting after the planner has
  # written the file compiles the tasks and everything after them.
  - name: implement
    agent: executor
    skills: [graphify]
    needs: [plan]
    scope: { mode: repo_wide }
    plan_tasks:
      from: "{{ stages.plan.outputs.plan }}"
      max: 5
      merge_hint: >
        Apply the shared-file changes the tasks deferred to you (Cargo.toml,
        Cargo.lock, crate `mod` declarations and re-exports, any schema/*.json
        touched by more than one task), then run the full gauntlet once from the
        repo root, with CARGO_TARGET_DIR set as the pipeline policy says:
        `rtk cargo fmt --all`, `rtk cargo clippy --workspace --all-targets --all-features -- -D warnings`,
        `rtk cargo nextest run --workspace`, `rtk cargo nextest run --workspace -P integration`,
        `rtk cargo test --workspace --doc`, and
        `rtk cargo run -p aidp-cli -- validate --all` with AIDP_SKILL_ROOT set, which
        checks every real template of the skill against this tree's binary.
        Fix cross-task breakage and write the consolidated changed-files.json.
        A red check never stops the run: do not spend the stage chasing a
        failure you cannot fix. For whatever is still red when you finish,
        including a test you believe fails on the default branch too, reply
        `needs_review`, name each failing test and check in `summary`, and set
        `signals.tests_failed`. The run continues to the review, which turns
        them into blocking findings, and the correction loop fixes them. Use
        `blocked` or `failed` only when the tree cannot be built at all.
    outputs: [changed-files.json]

  # --- Give back. Everything the reads above uncovered about aidp ITSELF (not
  # about this one change) is merged into the project knowledge base, in place,
  # so the next run - and any AI agent opening this repo - starts from it.
  - name: knowledge_sync
    type: pipeline
    uses: knowledge-update
    needs: [plan]
    with:
      sources: "{{ stages.discover.outputs.context }}, {{ stages.study.outputs.study }}"

  # Review, composed from the reusable `review` sub-pipeline (4 rubric
  # dimensions in parallel then synthesis). `needs: [implement]` cascades onto
  # its 4 root stages, so they still fan out in one parallel() block. Because
  # those axes read `implement` and feed `correction_loop`, the engine does not
  # pause on `implement`'s `needs_review` (red tests): it hands the report to
  # the axes, and the correctness axis files it as a blocking finding.
  - name: review
    type: pipeline
    when: "{{ inputs.track == 'deep' }}"
    uses: review
    needs: [implement]
    outputs:
      - { name: findings, from: review.findings }
      - { name: summary, from: review.summary }

  - name: correction_loop
    type: loop
    when: "{{ stages.review.outputs.findings.has_blocking_findings }}"
    max_iterations: "{{ settings.max_correction_iterations }}"
    body:
      - { name: replan, agent: planner, model: sonnet, with: { mode: correction }, inputs: { findings: "{{ stages.review.outputs.findings }}" } }   # delibere : une reprise de plan est un delta, pas une conception - opus serait surpaye
      # A failing test in the findings is fixed here, even one that also fails on
      # the default branch: the run has no other place to fix it. Still red after
      # the fix: reply `needs_review` naming the tests; the engine passes that on
      # to `rereview` instead of pausing, and the loop's exhaustion guard is the
      # human checkpoint.
      - { name: refix, agent: executor, model: haiku, scope: { mode: repo_wide }, needs: [replan], inputs: { task: "Apply the correction plan, following AGENTS.md at the repository root. Fix every blocking finding, failing tests first, including tests that look pre-existing or unrelated to this change. Then re-run from the repository root with CARGO_TARGET_DIR set as the pipeline policy says: `rtk cargo fmt --all`, `rtk cargo clippy --workspace --all-targets --all-features -- -D warnings`, `rtk cargo nextest run --workspace`, `rtk cargo test --workspace --doc`, plus `rtk cargo run -p aidp-cli -- validate --all` with AIDP_SKILL_ROOT set. If anything is still red, reply `needs_review`, name each failing test in `summary` and set `signals.tests_failed`." } }
      # Re-review the fixed code: the loop must re-produce the `findings` output it loops on, otherwise the loop condition never changes and the review stage is not linked back to the loop.
      - { name: rereview, agent: reviewer, skills: [graphify], needs: [refix], inputs: { task: "Re-review the fixed tree against AGENTS.md. Re-run `rtk cargo nextest run --workspace` and `rtk cargo test --workspace --doc` from the repository root (with CARGO_TARGET_DIR set as the pipeline policy says) yourself rather than trusting refix's report: each failing test is a `blocking` finding (category `tests`), pre-existing or not. Also run `rtk aidp skill-rules check --base <default branch> --out <your stage_dir>/skill-rules.json` from the repo root (<default branch> is `main` when it exists, else `master`) and turn every finding in that file into a `blocking` finding (category `conventions`) in your own findings.json." }, outputs: [findings.json, summary.md] }

  - name: pr
    policy:
      - "Open the PR with `rtk aidp gh pr-create --draft` only when the stage input pr_draft is true; otherwise open a regular PR."
    agent: executor
    model: haiku   # delibere : commit et ouverture de PR, mecanique - haiku suffit
    needs: [implement, review]
    inputs:
      pr_draft: "{{ settings.pr_draft }}"
      task: >
        Commit what this run changed on feat/{{ feature }} with Conventional
        Commits messages (one commit per layer when the changes split cleanly),
        never on the default branch. Then run `rtk git remote`: when the
        repository has no remote, do not push and write pr.json with `pr: null`,
        the branch and the reason; otherwise push the branch and open the PR
        against the default branch with `rtk aidp gh pr-create`. The PR body
        states the change, the checks run with their result, and the follow-ups
        for the skill repository listed in plan.md. No ticket or PR references
        in commit messages or in the body.
    scope: { mode: stage_dir_only }
    outputs: [pr.json]
