version: 5
id: dev-composed
description: >
  Demo of pipeline composition — implement a ticket, then reuse the standalone
  `audit` pipeline as a single `type: pipeline` stage instead of re-declaring its
  explore/audit/report stages.
inputs:
  # --- DEMAND. Exactly one of `jira_keys` / `prompt` carries it; everything from
  # `plan` onwards is the same pipeline either way.
  #
  # Mode A (Jira): one or more Jira US of the SAME feature (unitary US slicing);
  # one plan, one branch, one PR. A single US is a one-element list. The empty
  # list (the default) means the run is not Jira-driven.
  jira_keys: { required: false, kind: list, default: [], description: "Une ou plusieurs US Jira de la MEME feature, en tableau JSON (ex. [\"SQIPI-1\",\"SQIPI-2\"])" }
  # Mode B (prompt): the request in plain text, with no ticket behind it -
  # `discover_prompt` below turns it into the same requirements note `plan` would
  # otherwise have read off the tickets, so `implement` / `qa` / `pr` are
  # unchanged.
  #
  # `default: ""` is falsy, so on a Jira run `discover_prompt`'s input-only
  # `when:` is decided at compile time and the stage is never dispatched. (The
  # literal-`false` sentinel dev-discovery.yaml uses is a SUB-pipeline concern:
  # there, composition substitutes the parent's value - or this default - INTO
  # the guard string, where `""` would leave an unparseable empty expression.
  # This is a top-level template: the guard string stays `{{ inputs.prompt }}`
  # and is evaluated against the input itself.)
  prompt: { required: false, kind: string, default: "" }
  # Optional feature/epic label → the run's grouping folder and branch name.
  # Optional in Jira mode (derived from the ticket list); REQUIRED in prompt
  # mode, where nothing else can name the branch, the vault folder or the PR.
  feature: { required: false, kind: string, description: "Optional feature/epic label; feeds run::feature_key, which names the git branch and the vault run folder in place of deriving them from the ticket list." }
  target_path: { required: false, kind: string, default: "src" }
  stack: { required: false, kind: enum, values: [auto, generic, rust, csharp, lambda-ts], default: auto, description: "Language stack of the repo, which picks the implement stage's language skills via skills_by. auto (default) lets aidp run init detect it from marker files (Cargo.toml, *.sln / *.csproj, serverless.* + package.json); generic keeps the multi-stack skill set." }
stages:
  # First step: cut a fresh feature branch off an up-to-date master so every
  # later stage writes code, commits and the PR land on feat/<feature>, never on
  # master. `{{ feature }}` = epic label if given, else derived from the US list
  # - which is why prompt mode, having no US list, requires `feature`.
  # `plan` `needs` it → it runs alone, before anything else.
  - name: prepare_branch
    agent: executor
    skills: [git-branch-setup]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      branch: "feat/{{ feature }}"
    outputs: [branch.json]
    when: "true"

  # Demand, mode B. Same role as `discover_prompt` in dev-discovery.yaml, inlined
  # here because this template owns its demand: `plan` below reads the tickets
  # itself (skill `ticket-to-plan-aidp`) instead of composing `dev-discovery`, so
  # the prompt mode needs its own stage to produce the note the planner reads.
  # There is no ticket, so the whole job is turning a free-text request into
  # something plannable, and being explicit about what the request does NOT say.
  #
  # `when:` is a bare input reference: on a Jira run `prompt` is empty, hence
  # falsy, and `aidp workflow emit` drops this stage at compile time - it is never
  # dispatched and costs nothing, leaving the Jira path exactly as it was.
  - name: discover_prompt
    agent: analyzer
    skills: [graphify-context, writing-clearly-and-concisely]
    needs: [prepare_branch]
    inputs:
      request: "{{ inputs.prompt }}"
      task: >
        The demand for this run is the free-text `request` above - there is no
        Jira ticket. Write prompt_context.md as the requirements note a planner
        would otherwise get from a ticket, with these sections:
        (1) Demand - the request restated in one paragraph, plus the verbatim
        request quoted so nothing is lost in your restatement;
        (2) Scope - what is in, and an explicit OUT-OF-SCOPE list; a prompt is
        looser than a ticket, so bounding it is the main value you add here;
        (3) Acceptance criteria - testable, numbered, derived from the request,
        each one checkable against code or a test;
        (4) Assumptions - every gap you filled to make the request actionable,
        one line each, flagged as an assumption and NOT as a fact;
        (5) Open questions - what a human must answer, and what you decided to
        assume in the meantime so the run is not blocked;
        (6) Affected area - the components and paths the request most likely
        touches, found via the code graph, so the planner starts from a map
        rather than from a blank page.
        Invent no requirement the request does not support. If the request is too
        vague to bound, say so in one line at the top of the note and still
        produce the best-effort sections - `plan.md` and the PR gate are where a
        human stops the run, not this stage.
    outputs: [prompt_context.md]
    when: "{{ inputs.prompt }}"

  # `plan.json` (schema/plan.schema.json) is the machine contract: ONE OBJECT PER
  # TASK - prompt, instructions, `needs` (real dependencies) and `files` (the
  # task's write set). `aidp` compiles the implementation stage from it, so the
  # run's parallelism is decided here, by how the work is sliced into file-disjoint
  # tasks. The contract itself is injected into this stage's prompt by the emitter.
  # `plan.md` stays the human narrative (design, risks, rollback).
  #
  # This is also where the two demand modes converge: the planner reads the
  # tickets itself in Jira mode, and reads `discover_prompt`'s note in prompt
  # mode. Exactly one of the two inputs is real on any given run.
  - name: plan
    agent: planner
    skills: [ticket-to-plan-aidp]
    needs: [prepare_branch, discover_prompt]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      prompt_context: "{{ stages.discover_prompt.outputs.prompt_context }}"
      task: >
        The demand is in exactly ONE of `jira_keys` (Jira-driven run) or
        `prompt_context` (prompt-driven run). When `jira_keys` is empty (`[]`)
        there is no ticket to read and `prompt_context` IS the requirements note:
        plan from it, and carry its acceptance criteria, assumptions and open
        questions through into plan.json / plan.md verbatim rather than
        re-deriving them - on a prompt-driven run they are the only contract the
        implementation and the audit have. The other mode's stage was skipped at
        compile time, so neither its file nor the stage directory listed for it
        under `## Needs (upstream stage_dirs)` exists, which is expected, not an
        error.
    outputs: [plan.json, plan.md]

  # Plan-driven implementation: `aidp workflow emit` loads `plan.json`, validates
  # the task graph (unknown deps, cycles), inserts an ordering wherever two tasks
  # would write the same file, and emits one sub-agent per task - each starting as
  # soon as its OWN dependencies are done (no wave barrier), up to `max` at a time
  # in the shared working tree. A final merge sub-agent applies the shared-file
  # work the tasks deferred to it, builds, runs the suite, and writes the
  # consolidated changed-files.json. A single-task plan short-circuits the merge
  # and costs exactly what a plain stage costs.
  #
  # TWO-PASS stage: the first `workflow emit` stops here (the workflow returns
  # `awaiting_plan`); re-emitting once the planner has written the file compiles
  # the tasks plus everything after them. The v7 skill drives that round-trip.
  #
  # `scope: repo_wide` because the plan's tasks cover production code AND tests.
  - name: implement
    agent: executor
    skills_by: { input: stack, map: { rust: [rust-dev-aidp, rust-testing-aidp], csharp: [csharp-dev-aidp, feature-testing-aidp], lambda-ts: [lambda-ts-dev-aidp, feature-testing-aidp] }, default: [csharp-dev-aidp, lambda-ts-dev-aidp, feature-testing-aidp] }
    needs: [plan]
    scope: { mode: repo_wide }
    plan_tasks:
      from: "{{ stages.plan.outputs.plan }}"
      max: 4
      merge_hint: >
        Apply every shared-file change the tasks deferred to you (wiring, imports,
        module/DI registration), then build/compile the project and run the FULL
        test suite once. Fix cross-task breakage and write the consolidated
        changed-files.json covering every task.
    outputs: [changed-files.json]

  # Reuse the whole `audit` pipeline here. Its v7 stages are inlined at init as
  # qa__explore, qa__dim_correctness, qa__dim_security, qa__dim_perf,
  # qa__dim_maintainability, qa__verify, qa__report. Child inputs via `with:`.
  - name: qa
    type: pipeline
    uses: audit
    needs: [implement]
    with:
      target_path: "{{ inputs.target_path }}"
    outputs:
      - { name: report, from: report.audit-report }

  - name: pr
    policy:
      - "Open the PR with `rtk aidp gh pr-create --draft` only when the stage input pr_draft is true; otherwise open a regular PR."
    agent: executor
    skills: [git-push, writing-clearly-and-concisely]
    needs: [qa]
    inputs: { pr_draft: "{{ settings.pr_draft }}", audit_report: "{{ stages.qa.outputs.report }}" }
    scope: { mode: stage_dir_only }
    outputs: [pr.json]
    gate: true
