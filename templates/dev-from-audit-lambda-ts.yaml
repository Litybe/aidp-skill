version: 5
id: dev-from-audit-lambda-ts
description: >
  Implement a demand end-to-end in a Betclic AWS Lambda TypeScript service,
  using an existing audit report as additional context.

  DEMAND: Jira OR prompt. Pass `jira_keys` to drive the run from tickets, or
  `prompt` to drive it from a plain-text request with no ticket at all (then
  `feature` is required - it names the branch, the vault folder and the PR).
  The two modes are resolved into the same requirements note by the mutually
  exclusive `discover_jira` / `discover_prompt` stages, which `rtk aidp workflow
  emit` picks between at compile time, so everything from `discover` onwards is
  byte-identical between the modes.

  Same flow as
  `dev-from-audit` but stack-specific: `code` uses only `lambda-ts-dev-aidp`,
  and the test phase is an inline jest fan-out (unit ‖ integration) instead of
  the `dev-tests-csharp` sub-pipeline, which is .NET-only (Reqnroll/xUnit).
  Tracks via track = quick | standard | deep. The review phase is composed from
  the reusable `review` sub-pipeline (`type: pipeline`, `uses: review`). The
  discover/study group stays inline (not composed from `dev-discovery`) because
  `discover_code`/`study`/`plan` thread an extra `audit_report` input that the
  generic sub-pipeline doesn't carry; code/tests fan out into shards.
inputs:
  # --- DEMAND. Exactly one of `jira_keys` / `prompt` carries the demand; the
  # pipeline is identical from `discover` onwards either way.
  #
  # Mode A (Jira): one or more Jira US of the SAME feature (unitary US slicing);
  # one plan, one branch, one PR. A single US is a one-element list. An empty
  # list (`[]`) means the run is NOT Jira-driven.
  jira_keys: { required: false, kind: list, default: [], description: "Une ou plusieurs US Jira de la MEME feature, en tableau JSON (ex. [\"SQIPI-1\",\"SQIPI-2\"]). Laisser vide pour un run pilote par `prompt`." }
  # Mode B (prompt): the demand in plain text, with no ticket behind it -
  # `discover_prompt` turns it into the same requirements note `discover_jira`
  # would have produced, so `discover` / `study` / `plan` / `implement` /
  # `review` / `pr` are unchanged. In this mode `feature` is REQUIRED: nothing
  # else can name the branch, the vault folder or the PR.
  prompt: { required: false, kind: string, default: "", description: "La demande en texte libre, sans ticket. Laisser vide pour un run pilote par `jira_keys`." }
  # Optional feature/epic label → the run's grouping folder and branch name.
  # Optional in Jira mode (derived from the US list), REQUIRED in prompt mode.
  feature: { required: false, kind: string, description: "Nom de la feature : alimente run::feature_key (sa PREMIERE branche testee) - decide le nom de la branche git ET le dossier du vault Obsidian pour ce run." }
  audit_report: { required: true, kind: string, description: "Chemin d'audit-report.md issu d'un run audit prealable - fournit les findings deja connus au discover_code/study/plan." }   # path to audit-report.md from a prior audit run
  track: { required: true, kind: enum, values: [quick, standard, deep], default: standard, description: "Profondeur du run : quick saute l'etude et le gate de plan, standard fait les deux, deep gate le plan pour validation humaine avant la moindre ligne ecrite." }
settings:
  pr_draft: false
  max_correction_iterations: 2
  knowledge_graph:
    enabled: true
    refresh: never
    code_only: true
stages:
  # First step: cut a fresh feature branch off an up-to-date master so every
  # later stage writes code, commits and the PR land on feat/<feature>, never on
  # master. `{{ feature }}` = epic label if given, else derived from the US list.
  # The 3 context reads `needs` it → it runs alone, before the fan-out.
  - name: prepare_branch
    agent: executor
    skills: [git-branch-setup]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      branch: "feat/{{ feature }}"
    outputs: [branch.json]
    when: "true"

  # --- Context gathering: the demand read (`discover_jira` OR `discover_prompt` -
  # never both) alongside the Confluence and code-graph reads. The audit report is
  # threaded into the code read so the code analysis accounts for the known
  # findings. All `needs` prepare_branch → they fan out in parallel.
  #
  # Their `when:` are bare input references, so the mode that was not filled in is
  # falsy and its stage is dropped at compile time, costing nothing. That is why
  # `discover_prompt` is declared FIRST: `aidp workflow emit` ENDS a parallel group
  # at the first statically-skipped stage, so a dropped mode standing BETWEEN the
  # other reads would cut the fan-out in two. Declared up front, the skipped stage
  # is emitted on its own and everything after it still groups - a Jira run keeps
  # the full 3-wide fan-out (tickets ‖ Confluence ‖ code-graph), a prompt run emits
  # `discover_prompt` and then Confluence ‖ code-graph.

  # Demand, mode B: no ticket at all. Produces the SAME kind of artifact as
  # `discover_jira` - a requirements note - so the `discover` synthesis below (and
  # therefore study/plan/implement/review) consumes it without caring which mode
  # produced it. The audit report is threaded in here too: on a prompt-driven run
  # it is the only prior art the note can lean on, but it is CONTEXT, never the
  # demand - the demand is the user's request and nothing else.
  - name: discover_prompt
    agent: analyzer
    skills: [graphify-context, writing-clearly-and-concisely]
    needs: [prepare_branch]
    inputs:
      request: "{{ inputs.prompt }}"
      audit_report: "{{ inputs.audit_report }}"
      task: >
        The demand for this run is the free-text `request` above - there is no
        Jira ticket. `audit_report` is a PRIOR audit of this service: use it to
        locate the code the request touches and to reuse findings already
        written, never to widen the demand beyond what the request asks for.
        Write prompt_context.md as the requirements note a planner would
        otherwise get from a ticket, with these sections:
        (1) Demand - the request restated in one paragraph, plus the verbatim
        request quoted so nothing is lost in your restatement;
        (2) Scope - what is in, and an explicit OUT-OF-SCOPE list; a prompt is
        looser than a ticket, so bounding it is the main value you add here, and
        the audit's other findings are the first thing to declare out of scope
        unless the request names them;
        (3) Acceptance criteria - testable, numbered, derived from the request,
        each one checkable against code or a test;
        (4) Assumptions - every gap you filled to make the request actionable,
        one line each, flagged as an assumption and NOT as a fact;
        (5) Open questions - what a human must answer, and what you decided to
        assume in the meantime so the run is not blocked;
        (6) Affected area - the components and paths the request most likely
        touches, found via the code graph and cross-checked against the audit
        report, so the parallel code read and the planner start from the same map.
        Invent no requirement the request does not support. If the request is too
        vague to bound, say so in one line at the top of the note and still
        produce the best-effort sections - the plan gate is where a human stops
        the run, not this stage.
    outputs: [prompt_context.md]
    when: "{{ inputs.prompt }}"

  # Demand, mode A: read the tickets. `when:` is the bare `jira_keys` reference -
  # an empty list is falsy => skipped on a prompt-driven run.
  - name: discover_jira
    agent: analyzer
    skills: [analyze-jira-ticket-aidp]
    needs: [prepare_branch]
    inputs: { jira_keys: "{{ inputs.jira_keys }}" }
    outputs: [jira_context.md]
    when: "{{ inputs.jira_keys }}"

  - name: discover_confluence
    agent: analyzer
    skills: [analyze-confluence-docs-aidp]
    needs: [prepare_branch]
    inputs: { jira_keys: "{{ inputs.jira_keys }}" }
    outputs: [confluence_context.md]
    when: "true"

  - name: discover_code
    agent: analyzer
    skills: [graphify-context, enforcing-decision-records, aws-serverless]
    needs: [prepare_branch]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      audit_report: "{{ inputs.audit_report }}"
    outputs: [code_context.md]
    when: "true"

  # Synthesis: merges the parallel reads into the canonical context.md. One of
  # `jira_context` / `prompt_context` is ALWAYS absent - the other mode's stage
  # was dropped at compile time - and the note that exists is the demand.
  - name: discover
    agent: analyzer
    skills: [graphify-context]
    needs: [discover_jira, discover_prompt, discover_confluence, discover_code]
    inputs:
      jira_context: "{{ stages.discover_jira.outputs.jira_context }}"
      prompt_context: "{{ stages.discover_prompt.outputs.prompt_context }}"
      confluence_context: "{{ stages.discover_confluence.outputs.confluence_context }}"
      code_context: "{{ stages.discover_code.outputs.code_context }}"
      task: >
        Merge the upstream notes into context.md. The demand is in exactly ONE of
        `jira_context` (Jira-driven run) or `prompt_context` (prompt-driven run)
        - the other path was skipped and its file does not exist, which is
        expected, not an error. Carry the demand's acceptance criteria,
        assumptions and open questions through into context.md verbatim rather
        than re-deriving them: on a prompt-driven run they are the only contract
        the plan and the review have.
    outputs: [context.md]
    when: "true"

  - name: study
    agent: analyzer
    skills: [graphify-context, study-synthesis]
    needs: [discover]
    inputs:
      context: "{{ stages.discover.outputs.context }}"
      audit_report: "{{ inputs.audit_report }}"
    outputs: [study.md]
    when: "{{ inputs.track in ['standard','deep'] }}"

  # `plan.json` (schema/plan.schema.json) is the machine contract: ONE OBJECT PER
  # TASK - prompt, instructions, `needs` (real dependencies) and `files` (the
  # task's write set). `aidp` compiles the implementation stage from it, so the
  # run's parallelism is decided here, by how the work is sliced into file-disjoint
  # tasks. The contract itself is injected into this stage's prompt by the emitter.
  # `plan.md` stays the human narrative (design, risks, rollback).
  - name: plan
    agent: planner
    skills: [graphify-context, enforcing-decision-records, aws-serverless, ticket-to-plan-aidp]
    needs: [study, discover]
    with: { mode: feature }
    inputs:
      audit_report: "{{ inputs.audit_report }}"
    outputs: [plan.json, plan.md]
    gate: "{{ inputs.track == 'deep' }}"

  # Plan-driven implementation: `aidp workflow emit` loads `plan.json`, validates
  # the task graph (unknown deps, cycles), inserts an ordering wherever two tasks
  # would write the same file, and emits one sub-agent per task - each starting as
  # soon as its OWN dependencies are done (no wave barrier), up to `max` at a time
  # in the shared working tree. A final merge sub-agent applies the shared-file
  # work the tasks deferred to it, builds, runs the suite, and writes the
  # consolidated changed-files.json. A single-task plan short-circuits the merge
  # and costs exactly what a plain stage costs.
  #
  # TWO-PASS stage: the first `workflow emit` stops here (the workflow returns
  # `awaiting_plan`); re-emitting once the planner has written the file compiles
  # the tasks plus everything after them. The v7 skill drives that round-trip.
  #
  # `scope: repo_wide` because the plan's tasks cover production code AND tests.
  - name: implement
    agent: executor
    skills: [graphify-context, lambda-ts-dev-aidp, aws-serverless, feature-testing-aidp]
    needs: [plan]
    scope: { mode: repo_wide }
    plan_tasks:
      from: "{{ stages.plan.outputs.plan }}"
      max: 4
      merge_hint: >
        Apply every shared-file change the tasks deferred to you (serverless.yml
        function entries, shared types/validators, index barrels), then run the
        build/typecheck and the FULL jest suite once. Fix cross-task breakage and
        write the consolidated changed-files.json covering every task.
    outputs: [changed-files.json]

  # Review, composed from the reusable `review` sub-pipeline (4 rubric
  # dimensions in parallel → synthesis). `needs: [implement]` cascades onto
  # its 4 root dimension stages, reproducing the exact same parallel fan-out.
  - name: review
    type: pipeline
    uses: review
    needs: [implement]
    outputs:
      - { name: findings, from: review.findings }
      - { name: summary, from: review.summary }

  - name: correction_loop
    type: loop
    when: "{{ stages.review.outputs.findings.has_blocking_findings }}"
    max_iterations: "{{ settings.max_correction_iterations }}"
    body:
      - { name: replan, agent: planner, model: sonnet, with: { mode: correction }, inputs: { findings: "{{ stages.review.outputs.findings }}" } }   # delibere : une reprise de plan est un delta, pas une conception - opus serait surpaye
      - { name: refix, agent: executor, skills: [lambda-ts-dev-aidp], scope: { mode: repo_wide }, needs: [replan] }
      - { name: rereview, agent: reviewer, skills: [graphify-context, code-review-aidp], needs: [refix], outputs: [findings.json, summary.md] }

  - name: pr
    policy:
      - "Open the PR with `rtk aidp gh pr-create --draft` only when the stage input pr_draft is true; otherwise open a regular PR."
    agent: executor
    skills: [git-push, writing-clearly-and-concisely, teams-pr-notification]
    needs: [review]
    inputs: { pr_draft: "{{ settings.pr_draft }}" }
    scope: { mode: stage_dir_only }
    outputs: [pr.json]
    gate: true
