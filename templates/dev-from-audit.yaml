version: 5
id: dev-from-audit
description: >
  Implement a demand end-to-end, using an existing audit report as additional
  context. Tracks via track = quick | standard | deep. The review
  phase is composed from the reusable `review` sub-pipeline (`type: pipeline`,
  `uses: review`) — same as dev-csharp/dev/dev-lambda-ts. The discover/study
  group stays inline here (not composed from `dev-discovery`) because
  `discover_code`/`study`/`plan` thread an extra `audit_report` input that the
  generic sub-pipeline doesn't carry; code/tests fan out into shards.

  DEMAND: Jira OR prompt. Pass `jira_keys` to drive the run from tickets, or
  `prompt` to drive it from a plain-text request with no ticket at all (then
  `feature` is required - it names the branch, the vault folder and the PR).
  Because the discover group is inline, this template carries its own
  `discover_jira` / `discover_prompt` pair - the same pattern `dev-discovery`
  uses: two mutually exclusive stages producing the same requirements note, so
  everything from `discover` onwards is byte-identical between the two modes.
inputs:
  # --- DEMAND. Exactly one of `jira_keys` / `prompt` must be non-empty; the
  # pipeline is identical downstream of `discover` either way.
  #
  # Mode A (Jira): one or more Jira US of the SAME feature (unitary US slicing);
  # one plan, one branch, one PR. A single US is a one-element list.
  jira_keys: { required: false, kind: list, default: [], description: "Une ou plusieurs US Jira de la MEME feature, en tableau JSON (ex. [\"SQIPI-1\",\"SQIPI-2\"])" }
  # Mode B (prompt): the request in plain text, with no ticket behind it -
  # `discover_prompt` turns it into the same requirements note `discover_jira`
  # would have produced, so `discover` / `study` / `plan` / `implement` /
  # `review` / `pr` are unchanged. In this mode `feature` is REQUIRED: nothing
  # else can name the branch, the vault run folder or the PR.
  prompt: { required: false, kind: string, default: "", description: "La demande en texte libre, sans ticket Jira (mode prompt). Exactement un de jira_keys / prompt doit etre renseigne." }
  # Optional feature/epic label → the run's grouping folder and branch name.
  # Optional in Jira mode (derived from the ticket list), REQUIRED in prompt mode.
  feature: { required: false, kind: string, description: "Optional feature/epic label; feeds run::feature_key, which names the git branch and the vault run folder in place of deriving them from the ticket list." }
  audit_report: { required: true, kind: string, description: "Path to the audit-report.md produced by a prior audit run; read as extra context by discover_code, study and plan." }   # path to audit-report.md from a prior audit run
  track: { required: true, kind: enum, values: [quick, standard, deep], default: standard, description: "Run depth: quick, standard, or deep - deep adds a human gate before planning; defaults to standard." }
  stack: { required: false, kind: enum, values: [auto, generic, rust, csharp, lambda-ts], default: auto, description: "Language stack of the repo, which picks the implement stage's language skills via skills_by. auto (default) lets aidp run init detect it from marker files (Cargo.toml, *.sln / *.csproj, serverless.* + package.json); generic keeps the multi-stack skill set." }
settings:
  pr_draft: false
  max_correction_iterations: 2
  knowledge_graph:
    enabled: true
    refresh: never
    code_only: true
stages:
  # First step: cut a fresh feature branch off an up-to-date master so every
  # later stage writes code, commits and the PR land on feat/<feature>, never on
  # master. `{{ feature }}` = epic label if given, else derived from the US list.
  # The 3 context reads `needs` it → it runs alone, before the fan-out.
  - name: prepare_branch
    agent: executor
    skills: [git-branch-setup]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      branch: "feat/{{ feature }}"
    outputs: [branch.json]
    when: "true"

  # --- Context gathering: 3 independent reads (demand ‖ Confluence ‖ code-graph),
  # where "demand" is `discover_jira` OR `discover_prompt` — whichever input is
  # non-empty; the other is dropped at compile time. `discover_prompt` is
  # declared FIRST for that reason - see its comment below.
  # The audit report is threaded into the code read so the code analysis accounts
  # for the known findings. All `needs` prepare_branch → nothing in the DAG
  # serialises them.

  # Demand, mode B - the twin of `discover_jira`, mutually exclusive with it by
  # the same bare-input guard. Produces the SAME artifact shape (a requirements
  # note) so `discover` below merges it without caring which mode produced it.
  # Declared BEFORE `discover_jira` on purpose: the emitter groups adjacent
  # stages into one parallel() block greedily and ENDS the group at the first
  # statically-skipped stage, so a dropped twin sitting between the reads would
  # split the fan-out. Declaring it first puts that skip at the HEAD of the run
  # on a Jira run - it compiles to a bare log line - and keeps the three real
  # reads adjacent, hence one 3-wide parallel() block. On a prompt-driven run
  # this stage leads and the two remaining reads group behind it.
  # There is no ticket to read, so the whole job is turning a free-text request
  # into something plannable, and being explicit about what it does NOT say.
  # `audit_report` is threaded in because in THIS template the request is usually
  # "implement fixes from that audit" - it grounds the demand in real findings -
  # but the request, not the report, is what bounds the scope.
  - name: discover_prompt
    agent: analyzer
    skills: [graphify-context, writing-clearly-and-concisely]
    needs: [prepare_branch]
    inputs:
      request: "{{ inputs.prompt }}"
      audit_report: "{{ inputs.audit_report }}"
      task: >
        The demand for this run is the free-text `request` above - there is no
        Jira ticket. `audit_report` is the audit this pipeline builds on: read it
        as CONTEXT to ground the request in the findings it refers to, never as
        the demand itself - a finding the request does not cover stays out of
        scope. Write prompt_context.md as the requirements note a planner would
        otherwise get from a ticket, with these sections:
        (1) Demand - the request restated in one paragraph, plus the verbatim
        request quoted so nothing is lost in your restatement;
        (2) Scope - what is in, and an explicit OUT-OF-SCOPE list; name the audit
        findings the request covers and, separately, the ones it does not;
        (3) Acceptance criteria - testable, numbered, derived from the request,
        each one checkable against code or a test;
        (4) Assumptions - every gap you filled to make the request actionable,
        one line each, flagged as an assumption and NOT as a fact;
        (5) Open questions - what a human must answer, and what you decided to
        assume in the meantime so the run is not blocked;
        (6) Affected area - the components and paths the request most likely
        touches, found via the code graph and the audit's own file references, so
        the parallel code read and the planner start from the same map.
        Invent no requirement the request does not support. If the request is too
        vague to bound, say so in one line at the top of the note and still
        produce the best-effort sections - the plan gate is where a human stops
        the run, not this stage.
    outputs: [prompt_context.md]
    when: "{{ inputs.prompt }}"

  # Demand, mode A. `when:` is a BARE input reference, not an expression: an
  # empty list is falsy, so on a prompt-driven run this stage is dropped at
  # compile time and costs no sub-agent. On a Jira run `jira_keys` is non-empty,
  # so it runs exactly as it did when the guard read `when: "true"`.
  - name: discover_jira
    agent: analyzer
    skills: [analyze-jira-ticket-aidp]
    needs: [prepare_branch]
    inputs: { jira_keys: "{{ inputs.jira_keys }}" }
    outputs: [jira_context.md]
    when: "{{ inputs.jira_keys }}"

  - name: discover_confluence
    agent: analyzer
    skills: [analyze-confluence-docs-aidp]
    needs: [prepare_branch]
    inputs: { jira_keys: "{{ inputs.jira_keys }}" }
    outputs: [confluence_context.md]
    when: "true"

  - name: discover_code
    agent: analyzer
    skills: [graphify-context, enforcing-decision-records]
    needs: [prepare_branch]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      audit_report: "{{ inputs.audit_report }}"
    outputs: [code_context.md]
    when: "true"

  # Synthesis: merges the parallel reads into the canonical context.md. One of
  # `jira_context` / `prompt_context` is always absent (the other mode's stage
  # was dropped at compile time); the note that exists is the demand.
  - name: discover
    agent: analyzer
    skills: [graphify-context]
    needs: [discover_jira, discover_prompt, discover_confluence, discover_code]
    inputs:
      jira_context: "{{ stages.discover_jira.outputs.jira_context }}"
      prompt_context: "{{ stages.discover_prompt.outputs.prompt_context }}"
      confluence_context: "{{ stages.discover_confluence.outputs.confluence_context }}"
      code_context: "{{ stages.discover_code.outputs.code_context }}"
      task: >
        Merge the upstream notes into context.md. The demand is in exactly ONE of
        `jira_context` (Jira-driven run) or `prompt_context` (prompt-driven run)
        - the other path was skipped and its file does not exist, which is
        expected, not an error. Carry the demand's acceptance criteria,
        assumptions and open questions through into context.md verbatim rather
        than re-deriving them: on a prompt-driven run they are the only contract
        the plan and the review have.
    outputs: [context.md]
    when: "true"

  - name: study
    agent: analyzer
    skills: [graphify-context, study-synthesis]
    needs: [discover]
    inputs:
      context: "{{ stages.discover.outputs.context }}"
      audit_report: "{{ inputs.audit_report }}"
    outputs: [study.md]
    when: "{{ inputs.track in ['standard','deep'] }}"

  # `plan.json` (schema/plan.schema.json) is the machine contract: ONE OBJECT PER
  # TASK - prompt, instructions, `needs` (real dependencies) and `files` (the
  # task's write set). `aidp` compiles the implementation stage from it, so the
  # run's parallelism is decided here, by how the work is sliced into file-disjoint
  # tasks. The contract itself is injected into this stage's prompt by the emitter.
  # `plan.md` stays the human narrative (design, risks, rollback).
  - name: plan
    agent: planner
    skills: [graphify-context, enforcing-decision-records, ticket-to-plan-aidp]
    needs: [study, discover]
    with: { mode: feature }
    inputs:
      audit_report: "{{ inputs.audit_report }}"
    outputs: [plan.json, plan.md]
    gate: "{{ inputs.track == 'deep' }}"

  # Plan-driven implementation: `aidp workflow emit` loads `plan.json`, validates
  # the task graph (unknown deps, cycles), inserts an ordering wherever two tasks
  # would write the same file, and emits one sub-agent per task - each starting as
  # soon as its OWN dependencies are done (no wave barrier), up to `max` at a time
  # in the shared working tree. A final merge sub-agent applies the shared-file
  # work the tasks deferred to it, builds, runs the suite, and writes the
  # consolidated changed-files.json. A single-task plan short-circuits the merge
  # and costs exactly what a plain stage costs.
  #
  # TWO-PASS stage: the first `workflow emit` stops here (the workflow returns
  # `awaiting_plan`); re-emitting once the planner has written the file compiles
  # the tasks plus everything after them. The v7 skill drives that round-trip.
  #
  # `scope: repo_wide` because the plan's tasks cover production code AND tests.
  - name: implement
    agent: executor
    skills: [graphify-context]
    skills_by: { input: stack, map: { rust: [rust-dev-aidp, rust-testing-aidp], csharp: [csharp-dev-aidp, feature-testing-aidp, reqnroll-testing-aidp], lambda-ts: [lambda-ts-dev-aidp, feature-testing-aidp] }, default: [csharp-dev-aidp, lambda-ts-dev-aidp, feature-testing-aidp, reqnroll-testing-aidp] }
    needs: [plan]
    scope: { mode: repo_wide }
    plan_tasks:
      from: "{{ stages.plan.outputs.plan }}"
      max: 4
      merge_hint: >
        Apply every shared-file change the tasks deferred to you (DI registrations
        in AddXxxDependencies(), csproj/.sln entries), then build the solution and
        run the FULL `rtk dotnet test` suite once - including any test project a task
        bootstrapped (add it to the .sln first). Fix cross-task breakage and write
        the consolidated changed-files.json covering every task.
    outputs: [changed-files.json]

  # Review, composed from the reusable `review` sub-pipeline (4 rubric
  # dimensions in parallel → synthesis). `needs: [implement]` cascades onto
  # its 4 root dimension stages, reproducing the exact same parallel fan-out
  # as before.
  - name: review
    type: pipeline
    uses: review
    needs: [implement]
    outputs:
      - { name: findings, from: review.findings }
      - { name: summary, from: review.summary }

  - name: correction_loop
    type: loop
    when: "{{ stages.review.outputs.findings.has_blocking_findings }}"
    max_iterations: "{{ settings.max_correction_iterations }}"
    body:
      # delibere : une reprise de plan est un delta, pas une conception - opus serait surpaye
      - { name: replan, agent: planner, model: sonnet, with: { mode: correction }, inputs: { findings: "{{ stages.review.outputs.findings }}" } }
      - { name: refix, agent: executor, scope: { mode: repo_wide }, needs: [replan] }
      - { name: rereview, agent: reviewer, skills: [graphify-context, code-review-aidp], needs: [refix], outputs: [findings.json, summary.md] }

  - name: pr
    policy:
      - "Open the PR with `rtk aidp gh pr-create --draft` only when the stage input pr_draft is true; otherwise open a regular PR."
    agent: executor
    skills: [git-push, writing-clearly-and-concisely, teams-pr-notification]
    needs: [review]
    inputs: { pr_draft: "{{ settings.pr_draft }}" }
    scope: { mode: stage_dir_only }
    outputs: [pr.json]
    gate: true
