version: 5
id: dev
description: >
  Implement one feature end-to-end, plan-driven, from a Jira ticket list or from
  a plain-text prompt. Tracks via track = quick | standard | deep.

  DEMAND: Jira OR prompt. Pass `jira_keys` to drive the run from tickets, or
  `prompt` to drive it from a plain-text request with no ticket at all (then
  `feature` is required - it names the branch, the vault folder and the PR).
  `dev-discovery` resolves the two into the same requirements note at compile
  time, so everything from `plan` onwards is byte-identical between the modes.
  The `plan` stage writes an EXECUTABLE plan
  (`plan.json`: one task object per unit of work, each carrying its own prompt
  and its write set), and `aidp` compiles that task graph into the `implement`
  stage — one sub-agent per task, running in parallel wherever their write sets
  are disjoint and serialized wherever they are not, then a merge sub-agent that
  wires the plan's shared files and builds. Production code AND tests are tasks
  of that plan, so the test phase is no longer a separate stack-specific stage.
  Context-gathering and review are still composed from the reusable
  `dev-discovery` / `review` sub-pipelines (`type: pipeline`, `uses:`), keeping
  the canonical stage names `discover` / `review` so downstream refs hold.
inputs:
  # --- DEMAND. Exactly one of `jira_keys` / `prompt` must be non-empty; the
  # pipeline is identical downstream of `discover` either way.
  #
  # NOTHING IN THIS CONTRACT ENFORCES THAT RULE. There is no "exactly one of"
  # constraint in the input schema, and relaxing `jira_keys` to
  # `required: false` (needed for the prompt mode) removed the last thing that
  # made a demand-less run impossible: a run passing NEITHER input validates and
  # compiles a full pipeline whose discovery yields no requirements note at all.
  # The rule is held by the callers instead — above all the daemon's
  # `build_launch`, which always supplies exactly one (Jira keys for a
  # Jira-mirrored ticket, prompt + feature otherwise).
  #
  # Mode A (Jira): one or more Jira US of the SAME feature. With the newer, more
  # unitary US slicing, a feature is several small stories — pass them all here
  # and the run treats them as one feature (discovery reads them all, one plan,
  # one branch, one PR referencing every US). A single US is just a one-element
  # list. Empty list => not Jira-driven.
  #
  # `default: []` is deliberate and must stay: the engine's alias coercion fires
  # when the list is absent OR empty, so the documented `--target SQIPI-N`
  # shorthand still lands in `jira_keys: ["SQIPI-N"]` despite the default. On a
  # prompt-driven run the generic `target` alias is held back, so a local
  # ticket's key is never fabricated into `jira_keys`.
  jira_keys: { required: false, kind: list, default: [], description: "Une ou plusieurs US Jira de la MEME feature, en tableau JSON (ex. [\"SQIPI-1\",\"SQIPI-2\"])" }
  # Mode B (prompt): the request in plain text, with no ticket behind it —
  # `discover_prompt` turns it into the same requirements note `discover_jira`
  # would have produced, so `plan` / `implement` / `review` / `pr` are unchanged.
  # In this mode `feature` is REQUIRED: nothing else can name the branch, the
  # vault folder or the PR.
  prompt: { required: false, kind: string, default: "" }
  # Optional feature/epic label. When set it becomes the run's grouping folder
  # (`<vault>/Pipelines/<repo>/<feature>/`) and the branch name (`feat/<feature>`);
  # otherwise both are derived from the ticket list (see `{{ feature }}`).
  feature: { required: false, kind: string, description: "Optional feature/epic label; feeds run::feature_key, which names the git branch and the vault run folder in place of deriving them from the ticket list." }
  track: { required: true, kind: enum, values: [quick, standard, deep], default: standard, description: "Run depth: quick, standard, or deep - deep adds a human gate before planning; defaults to standard." }
  stack: { required: true, kind: enum, values: [auto, generic, rust, csharp, lambda-ts], default: auto, description: "Stack ciblée par le stage implement, qui pilote via skills_by la liste de skills qui lui est injectée : auto (défaut) laisse aidp run init la détecter d'après les fichiers marqueurs du dépôt (Cargo.toml, *.sln / *.csproj, serverless.* + package.json) ; generic reprend le jeu multi-stack (C#/.NET, Lambda TS, tests) ; lambda-ts bascule sur le jeu resserré de templates/dev-lambda-ts.yaml ; csharp et rust sur leur seul jeu." }
settings:
  pr_draft: false
  max_correction_iterations: 2
  knowledge_graph:
    enabled: true
    refresh: never
    code_only: true
stages:
  # First step: cut a fresh feature branch off an up-to-date master so every
  # later stage writes code, commits and the PR land on feat/<feature>, never on
  # master. `{{ feature }}` is the epic label if given, else derived from the US
  # list — the same segment the run folder is grouped under, so branch and folder
  # always agree. The 3 context reads `needs` it → it runs alone, before the fan-out.
  - name: prepare_branch
    agent: executor
    skills: [git-branch-setup]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      branch: "feat/{{ feature }}"
    outputs: [branch.json]
    when: "true"

  # Context-gathering + study, composed from the reusable `dev-discovery`
  # sub-pipeline (demand ‖ discover_confluence ‖ discover_code →
  # discover → study), where "demand" is `discover_jira` or `discover_prompt`
  # depending on which input is non-empty (the other is dropped at compile time).
  # `needs: [prepare_branch]` cascades onto its root stages, reproducing the
  # exact same parallel fan-out as before.
  - name: discover
    type: pipeline
    uses: dev-discovery
    needs: [prepare_branch]
    with:
      jira_keys: "{{ inputs.jira_keys }}"
      prompt: "{{ inputs.prompt }}"
      track: "{{ inputs.track }}"
    outputs:
      - { name: context, from: discover.context }
      - { name: study, from: study.study }

  # The plan is now a machine contract: `plan.json` (schema/plan.schema.json) is
  # ONE OBJECT PER TASK — prompt, instructions, `needs` (real dependencies) and
  # `files` (the task's write set). `aidp` reads it and compiles the `implement`
  # stage from it, so how much parallelism the run gets is decided here, by how
  # the planner slices the work into file-disjoint tasks. The exact contract is
  # injected into this stage's prompt by the emitter — templates never restate it.
  # `plan.md` stays the human narrative (design, risks, rollback).
  - name: plan
    agent: planner
    skills: [graphify-context, enforcing-decision-records, ticket-to-plan-aidp]
    needs: [discover]
    with: { mode: feature }
    outputs: [plan.json, plan.md]
    gate: "{{ inputs.track == 'deep' }}"

  # Plan-driven implementation: `aidp workflow emit` loads `plan.json`, checks the
  # task graph (unknown deps, cycles), inserts an ordering wherever two tasks
  # would write the same file, and emits one sub-agent per task — each starting
  # the moment its OWN dependencies are done (no wave barrier), up to `max` at a
  # time in the shared working tree. A final merge sub-agent applies the
  # shared-file changes the tasks deferred to it, builds, runs the suite, and
  # writes the consolidated changed-files.json. A plan with a single task
  # short-circuits the merge and costs exactly what a plain stage costs.
  #
  # This is a TWO-PASS stage: the first `workflow emit` stops here (the workflow
  # returns `awaiting_plan`), and re-emitting once the planner has written the
  # file compiles the tasks plus everything after them. The v7 skill drives it.
  #
  # `scope: repo_wide` because the plan's tasks cover production code AND tests.
  - name: implement
    agent: executor
    # skills_by routes on the `stack` input: each bucket's SKILL.mds apply only
    # to their own stack; a task may add its own on top.
    skills: [graphify-context]
    skills_by:
      input: stack
      map:
        generic:   [csharp-dev-aidp, lambda-ts-dev-aidp, feature-testing-aidp, reqnroll-testing-aidp]
        lambda-ts: [lambda-ts-dev-aidp, aws-serverless, feature-testing-aidp]
        csharp:    [csharp-dev-aidp, feature-testing-aidp, reqnroll-testing-aidp]
        rust:      [rust-dev-aidp, rust-testing-aidp]
      default:     [csharp-dev-aidp, lambda-ts-dev-aidp, feature-testing-aidp, reqnroll-testing-aidp]
    needs: [plan]
    scope: { mode: repo_wide }
    plan_tasks:
      from: "{{ stages.plan.outputs.plan }}"
      max: 4
      merge_hint: >
        Applique chaque changement de fichier partagé que les tâches t'ont
        délégué (câblage DI / modules, entrées de manifeste, barrels,
        références de projet), puis lance UNE fois le build du projet et la
        suite de tests COMPLÈTE - y compris tout projet de test qu'une tâche
        a créé, en l'enregistrant d'abord dans le manifeste du dépôt. La
        commande exacte est la responsabilité du SKILL.md de stack chargé
        par ce stage. Répare les cassures inter-tâches et écris le
        changed-files.json consolidé couvrant chaque tâche.
    outputs: [changed-files.json]

  # Review, composed from the reusable `review` sub-pipeline (4 rubric
  # dimensions in parallel → synthesis). `needs: [implement]` cascades onto its
  # 4 root dimension stages, reproducing the exact same parallel fan-out.
  - name: review
    type: pipeline
    uses: review
    needs: [implement]
    outputs:
      - { name: findings, from: review.findings }
      - { name: summary, from: review.summary }

  - name: correction_loop
    type: loop
    when: "{{ stages.review.outputs.findings.has_blocking_findings }}"
    max_iterations: "{{ settings.max_correction_iterations }}"
    body:
      # delibere : une reprise de plan est un delta, pas une conception - opus serait surpaye
      - { name: replan, agent: planner, model: sonnet, with: { mode: correction }, inputs: { findings: "{{ stages.review.outputs.findings }}" } }
      - { name: refix, agent: executor, scope: { mode: repo_wide }, needs: [replan] }
      - { name: rereview, agent: reviewer, skills: [graphify-context, code-review-aidp], needs: [refix], outputs: [findings.json, summary.md] }

  - name: pr
    policy:
      - "Open the PR with `rtk aidp gh pr-create --draft` only when the stage input pr_draft is true; otherwise open a regular PR."
    agent: executor
    skills: [git-push, writing-clearly-and-concisely, teams-pr-notification]
    needs: [review]
    inputs: { pr_draft: "{{ settings.pr_draft }}" }
    scope: { mode: stage_dir_only }
    outputs: [pr.json]
    gate: true
