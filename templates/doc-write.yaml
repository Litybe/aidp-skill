version: 5
id: doc-write
description: >
  Gamedev route `doc`, produce step: one GitHub issue that asks for a
  documentation change (BIBLE under .claude/BIBLE/, project docs under Docs/,
  ROADMAP) becomes a draft PR. Stages: prepare (issue, branch, reading plan by
  index), write (edit the documents, consistent with the canon), report
  (check, commit, push, draft PR `Closes #n`).

  Canon discipline: the BIBLE is read by index (00_INDEX, order of reading,
  « comment utiliser la bible selon la tâche »), never whole. 01_canon wins
  over every other document; then the owner document of the subject
  (04_regle_de_conflit, canon §10.1). A contradiction found is not silently
  resolved in the edited file: it is noted in 99_revue_critique/ and the
  PR body, and a decision for the project director goes in the « Questions
  ouvertes » section that closes each document. Identifier conventions
  (M<n>, B<n>, R<n>_<nn>_<role>, A<n>, E-B<n>-<nn>, BEAT-<nn>...) and state
  markers ((existe), [à implémenter], [NOUVEAU — à produire], [proposition
  hors canon]) are kept. A proposal that changes the canon stays marked
  [proposition hors canon]; it never enters 01_canon/ without the director.
  No Unity needed. The guardian rule of the project applies: when a
  roadmap task is completed, Docs/ROADMAP.md is updated.

  Outputs read by the flow (contract C4): pr.json {pr, branch, summary}.
  Stage ids are the C5 ones (prepare, write, report).
inputs:
  issue: { required: false, kind: string, default: "", description: "GitHub issue number describing the documentation change; the PR will close it (`Closes #n`)." }
  prompt: { required: false, kind: string, default: "", description: "What to write or change. Empty: taken from the issue body." }
  feature: { required: false, kind: string, description: "Ticket label; names the vault run folder." }
settings:
  knowledge_graph:
    enabled: false
stages:
  - name: prepare
    agent: executor
    model: haiku
    scope: { mode: repo_wide }
    policy:
      - "Never ask the user a question. Decide open points yourself and record them as assumptions."
      - "Read only except creating the working branch."
    inputs:
      issue: "{{ inputs.issue }}"
      prompt: "{{ inputs.prompt }}"
    with:
      instructions: >
        (1) `rtk gh repo view --json nameWithOwner,defaultBranchRef`. (2) The
        request: `prompt`, else the issue (`rtk gh issue view <n> --json
        title,body,labels`), with its criteria (CA-n). (3) Reading plan from
        the BIBLE index: read .claude/BIBLE/00_INDEX/ (reading order,
        identifier conventions, state markers, 04_regle_de_conflit, 05
        « comment utiliser la bible selon la tâche »), then list the exact
        sub-files to read for this request (documents of the task row, plus
        01_canon sections that bind it) and the documents to edit. (4)
        Branch: the current one when it is not the base branch, else
        `doc/<issue>-<slug>` from the base branch (`git switch -c`). Write
        context.json: repo, projectRoot, baseBranch, branch, issue, title,
        request, criteria, reading_plan (list of files), targets (list of
        files to edit), owner_documents.
    outputs: [context.json]

  - name: write
    agent: executor
    model: opus
    needs: [prepare]
    scope: { mode: repo_wide }
    policy:
      - "Never ask the user a question; decide open points and record them as assumptions."
      - "Edit documentation only (.claude/BIBLE/, Docs/, ROADMAP). No code, scene, asset or LDtk change."
      - "Read the context.reading_plan files first. 01_canon wins; then the owner document; a contradiction is noted in 99_revue_critique/, never erased. Do not rename identifiers."
      - "Do not commit. Keep the existing structure: one folder per document, sections as sub-files, a « Questions ouvertes » section at the end."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
    with:
      instructions: >
        Apply `context.request` in the targets: keep identifier conventions
        and state markers, cross-reference by identifier, write in the voice
        rules of 12_guide_ecriture_textes when the text is in-game, and add
        any open decision to the document's « Questions ouvertes ». After
        editing, run the coherence checks yourself: every identifier you cite
        exists in its owner document, no figure (module size 64 x 38 cells,
        enemy counts, ability order, biome) differs from 01_canon and the
        owner document, every edited document keeps its sub-file layout and
        a Questions ouvertes section, and no link or path you wrote is dead
        (`rtk grep`). Write write.json: files_changed (with a one-line
        reason), canon_facts_used (list of {fact, source}), contradictions
        (list of {where, with, resolution}), open_questions, assumptions,
        checks (list of {check, ok, detail}).
    outputs: [write.json]

  - name: report
    agent: executor
    model: haiku
    needs: [write]
    scope: { mode: repo_wide }
    policy:
      - "Never ask the user a question. Never merge, never mark the PR ready."
      - "Commit only the documentation files of write.json on the working branch; never the base branch."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      write: "{{ stages.write.outputs.write }}"
    with:
      instructions: >
        (1) Commit (`docs(bible): ...` or `docs: ...`, French, one commit per
        subject) and push the branch. (2) Open the PR as a DRAFT (`rtk gh pr
        create --draft`) or update the existing one; title `docs: <subject>`.
        Body: what changed per file, the canon facts used, contradictions
        noted, open questions for the director, the checks, then `Closes
        #<issue>` when context.issue is set. (3) Write pr.json {"pr":
        <number>, "branch": "<branch>", "summary": "<one sentence>", "url":
        "<url>", "files": <n>}.
    outputs: [pr.json]
