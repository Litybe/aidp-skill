version: 5
id: flow-doctor
description: >
  Investigates one broken pipeline incident for the daemon's doctor: a flow
  ended failed or escalated, a native run stopped paused, a step stayed
  running after its run ended, or a step waited external for over 30
  minutes. The daemon gathers the evidence bundle (flow state.json, journal
  and runtime, run-state.json, native-run.json, the stage replies and
  results, the filtered tail of daemon.err.log, the PR status, the Unity
  status, and for bugs that do not converge bug-history.json,
  test-infra.json, pr-lag.json and shared-patterns.json) before the run
  starts; the run works in that bundle directory.
  prepare → diagnose → report. The diagnose stage writes diagnosis.json:
  category, cause, evidence[], confidence, action, params, needs_human,
  proposed_patch, summary. The agent only proposes: the daemon checks the
  action against its allowed list and its preconditions, executes it at most
  once, and posts the comment. Nothing here writes to GitHub, the game, the
  harness or Unity.

  Started only by the daemon (one investigation at a time, outside the dev
  and test slots, under the budget guard). Never started by hand.
inputs:
  incident: { required: true, kind: string, description: "Incident id: <key>/<step>@<iteration> or <key>/run:<run id>; a ticket whose bugs reached the cap ends <key>/bug_capped_stop@<iteration>.<time>." }
  bundle: { required: true, kind: string, description: "Absolute path of the incident's bundle; the evidence is under evidence/." }
  feature: { required: false, kind: string, description: "Names the vault run folder." }
settings:
  knowledge_graph:
    enabled: false
stages:
  - name: prepare
    agent: executor
    model: haiku
    scope: { mode: stage_dir_only }
    policy:
      - "Never ask the user a question. Decide open points yourself and record them as assumptions."
      - "Read only: the bundle, the repositories and `rtk gh` reads. No commit, no push, no branch switch, no GitHub write, no call that changes the daemon."
      - "Never open, start, focus or stop Unity. Never edit the game's code, scenes, prefabs or assets. Never install, edit or run a setup of the harness (aidp, the skill, hooks)."
    inputs:
      incident: "{{ inputs.incident }}"
      bundle: "{{ inputs.bundle }}"
    with:
      instructions: >
        (1) Read `<bundle>/evidence/incident.json` (the incident: trigger,
        key, ticket, step, iteration, run id, what detection saw, and the
        list of copied files). (2) Read every listed file: flow-state.json
        (steps, status, reason, detail, outputs), flow-journal.jsonl (the
        transitions in order), flow-runtime.json (the run id of each pipeline
        step), run-state.json and native-run.json (stage rows, reason),
        stages/<stage>/ (replies and result.json), daemon.err.log.tail,
        pr-status.json, unity-status.json, and the evidence the daemon computed
        about bugs that do not converge: bug-history.json (per bug of the
        parent: commit, subject, commits, files with added and deleted
        lines), test-infra.json (test-infrastructure files the branch changed
        against origin/main, status, before_bytes, after_bytes, suspect),
        pr-lag.json (behind_by, mergeable, conflicts, pr_mergeable) and
        shared-patterns.json (errors found in the reports of 2 tickets or
        more over 24 h: key, sample, tickets). (3) Write context.json: incident,
        trigger, ticket, flow status, failing step with its reason and
        detail, a timeline (time, source file, event) of the last relevant
        transitions, the last stage replies (stage, status, summary,
        blocked_reason), the PR (number, state, mergeable, head sha, checks),
        the Unity editor (running, heartbeat state and age, lastCompile,
        lock holder and waiters), a `convergence` object copying bug-history,
        test-infra, pr-lag and shared-patterns as they are, and the log lines that name the key, the
        ticket or the run. Copy facts, never interpret them here.
    outputs: [context.json]

  - name: diagnose
    agent: executor
    model: opus
    needs: [prepare]
    scope: { mode: stage_dir_only }
    policy:
      - "Never ask the user a question. Read only, as in prepare: no GitHub write, no commit, no Unity, no edit of the game or of the harness. The daemon executes; you only propose."
      - "`action` is exactly one of: retry_step, requeue_to_test, requeue_dev, abort_dead_flow_and_requeue, update_pr_branch, release_unity_lock, create_bug_ticket, open_harness_pr, restore_test_infra, none. Any other name is refused."
      - "Never propose a merge, a gate approval, a force-push or a rebase. update_pr_branch updates by merge only."
      - "Never propose, request or start a generation, a retouch or an edit of a sprite or of any asset: that is the art pipeline's work. A run of art stopped on art findings is not an incident; only a passing fault of an art run may be retried."
      - "Act. `none` only with the reason written in `cause` (the fault already cleared by itself). `needs_human` only when no allowed action can help. Never hide behind doubt: pick the safest action that moves the ticket."
      - "Confidence: 0.5 is enough for the reversible actions (retry_step, requeue_to_test, requeue_dev); the others need 0.7. Under the bar the daemon asks a human and runs nothing."
      - "A test that returns passed=false, or a review with real defects, on a ticket: category product_bug, action create_bug_ticket (the daemon raises the bug issue under the ticket, capped at 3). Without a ticket: none, with the reason."
      - "A defect of the harness: category harness_defect, a unified diff against origin/main in proposed_patch and action open_harness_pr, params.repo Litybe/aidp (crates/, docs/) or Litybe/aidp-skill (templates/, agents/). Never apply the patch yourself."
      - "Bugs that do not converge (trigger bugs_not_converging): read bug-history.json, test-infra.json, pr-lag.json and shared-patterns.json FIRST; the daemon computed them. Try test_infra_regression, branch_behind_main, shared_harness_failure, then real_defect. Never a 4th bug on the same cause."
      - "Every evidence item names a bundle file and quotes the timestamp or the log line it rests on."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      bundle: "{{ inputs.bundle }}"
      task: >
        Classify the incident and propose at most one allowed action, the
        most useful one. Known pipeline failures (category → usual action):
        mcp_connect_timeout, an MCP server CONNECT_TIMEOUT or "connection
        timed out" → retry_step; unity_compile_timeout, the Unity compile
        gate timed out → retry_step; session_lost, the agent session was lost
        → retry_step; false_failure, the report stage answered needs_review
        while the PR exists and its recheck is clean → retry_step;
        run_ended_flow_running, the run is done or failed but the flow step
        is still running → retry_step (the daemon reconciles first);
        unity_reimport_not_frozen, the heartbeat went silent while the editor
        imported or reloaded → retry_step; unity_modal_dialog, the editor
        runs, its heartbeat is stale and never comes back → needs_human (a
        modal window needs a person); budget_wait_silent, a step waits for
        budget with nothing journaled → retry_step when the budget allows a
        run again; worktree_cap_saturated, git.worktree waits on
        worktree_cap while blocked tickets hold the worktrees → needs_human;
        dead_flow_ownership, the ticket is skipped owned-by-flow by a failed
        or escalated flow → abort_dead_flow_and_requeue; meta_add_add_conflict,
        an add/add conflict on the .meta of a folder several PRs created →
        update_pr_branch when the merged result keeps one .meta;
        rebase_conflict_only, `gh pr update-branch --rebase` conflicts while
        the final trees do not → update_pr_branch; head_moved_before_merge,
        the PR head changed between the read and the merge → needs_human (the
        merge gate is a human's); product_bug → create_bug_ticket;
        test_infra_regression, test-infra.json lists a file under
        Assets/Tests/Playtest, Packages or ProjectSettings that the branch
        changed with suspect true (deleted, or shrunk by 30 % or more: a
        re-saved scene without its Player is 12 KB against 27 KB on main) and
        every test fails the same way → restore_test_infra, params.files the
        suspect paths (the daemon puts them back from origin/main on the
        feature branch with a normal push, then reruns the test and re-arms
        the cap of bugs); branch_behind_main, pr-lag.json shows behind_by
        above 0 or mergeable false and the errors come from the lag or from
        an environment error such as "InputSettings has lost its native
        object" → update_pr_branch (by merge; the daemon then reruns the
        test); shared_harness_failure, shared-patterns.json lists a pattern
        found in the reports of 2 tickets or more (a fidelity check exit 1,
        "no player in the scene") → open_harness_pr when you can write a safe
        patch, params.repo and params.pattern, else create_bug_ticket (the
        daemon raises it on the dedicated harness issue, never under a game
        ticket; one incident covers all the tickets), params.pattern and
        params.tickets; real_defect, a proven defect of the game that the
        earlier bugs did not fix → create_bug_ticket with params.defect,
        params.file and params.criterion (the daemon allows one more bug past
        the cap only if the cause differs from bug-history.json), else
        needs_human with the defect, the file and the criterion written in
        cause;
        harness_defect → open_harness_pr when you can write a patch that
        applies, else needs_human; other. A step that failed and can run
        again → retry_step; a ticket with no flow that must go back to a lane
        → requeue_to_test (test step) or requeue_dev. release_unity_lock only
        when the lock holder's flow is terminal; the daemon checks it again.
        Write diagnosis.json: {"category": "<category>", "cause": "<one
        sentence, always filled>", "evidence": [{"file": "<bundle file>",
        "at": "<time>", "line": "<quoted line>"}], "confidence": <0..1>,
        "action": "<allowed action>", "params": {<step | pr, repo | resource
        | repo, summary | files | pattern, tickets | defect, file, criterion,
        only when needed>}, "needs_human": <bool>,
        "proposed_patch": <null or a unified diff>, "summary": "<two
        sentences in French>"}.
    outputs: [diagnosis.json]

  - name: report
    agent: executor
    model: haiku
    needs: [diagnose]
    scope: { mode: stage_dir_only }
    policy:
      - "Never ask the user a question. No GitHub write: the daemon appends the result of the action and posts the comment itself."
      - "Read only, as in prepare: no commit, no Unity, no edit of the game or of the harness."
    inputs:
      diagnosis: "{{ stages.diagnose.outputs.diagnosis }}"
    with:
      instructions: >
        Write report.md in French, 8 lines at most, for the ticket's issue:
        « Diagnostic », the category and the cause in one sentence, the two
        strongest evidence items (file and time), the proposed action, and
        « Intervention humaine requise » when needs_human is true. When
        proposed_patch is set, say a harness patch is proposed in the vault
        run folder; never paste it. No title, no greeting.
    outputs: [report.md]
