# Game art delivery: pixel art asset issue to merged PR.
# Claim, art-produce, art-review <-> art-fix loop, art-import <-> art-fix loop (Unity Editor), human merge.
# Labels `aidp:*` come from gh.issue_label, every review and test is commented on the issue
# (gh.issue_comment). A loop that runs out of rounds sets `blocked` and ends the run `escalated` (`fail` with kind business).
# Loop `max` is a literal (the schema wants a u32); keep it equal to settings.max_*_rounds. `until` also stops
# the loop on settings.max_*_rounds so that the blocked label and the business `fail` run (a loop ended by
# `max` alone escalates the run at once, nothing after it runs).
# Start with POST /api/tickets/:key/flow {"flow": "game-art"}.
id: game-art
version: 1
inputs:
  ticket: { required: true }
settings:
  max_review_rounds: 2
  max_test_rounds: 2
steps:
  - { id: claim, kind: action, use: gh.issue_label, with: { state: in-progress }, phase: Préparation }
  - { id: worktree, kind: action, use: git.worktree, phase: Préparation }
  - { id: branch, kind: action, use: git.branch, phase: Préparation }
  - { id: produce, kind: pipeline, use: art-produce, phase: Réalisation, pushes: true }
  - id: review_loop
    kind: loop
    phase: Revue
    max: 2
    until: "steps.review.outputs.verdict == 'done' || !(steps.review_loop.iteration < settings.max_review_rounds)"
    body:
      - { id: review_label, kind: action, use: gh.issue_label, with: { state: review } }
      - { id: review, kind: pipeline, use: art-review, pushes: false }
      - id: review_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Revue art-review : {{ steps.review.outputs.verdict }}", cost_footer: true }
        on_error: warn
      - id: fix
        kind: pipeline
        use: art-fix
        pushes: true
        when: "steps.review.outputs.verdict == 'need-fix'"
        with: { report_from: review }
  - { id: review_exhausted, kind: action, use: gh.issue_label, with: { state: blocked }, phase: Revue, when: "steps.review.outputs.verdict != 'done'" }
  - { id: review_escalate, kind: action, use: fail, phase: Revue, with: { kind: business, message: "Revue épuisée : issue bloquée" }, when: "steps.review.outputs.verdict != 'done'" }
  - id: test_loop
    kind: loop
    phase: Test Unity
    max: 2
    until: "steps.test.outputs.passed == true || !(steps.test_loop.iteration < settings.max_test_rounds)"
    body:
      - { id: test_label, kind: action, use: gh.issue_label, with: { state: testing } }
      - { id: test, kind: pipeline, use: art-import, pushes: true, resource: unity-editor }
      - id: test_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Test art-import : passed={{ steps.test.outputs.passed }}", cost_footer: true }
        on_error: warn
      - id: fix_test
        kind: pipeline
        use: art-fix
        pushes: true
        when: "steps.test.outputs.passed == false"
        with: { report_from: test }
  - { id: test_exhausted, kind: action, use: gh.issue_label, with: { state: blocked }, phase: Test Unity, when: "steps.test.outputs.passed != true" }
  - { id: test_escalate, kind: action, use: fail, phase: Test Unity, with: { kind: business, message: "Test épuisé : issue bloquée" }, when: "steps.test.outputs.passed != true" }
  - { id: ready, kind: action, use: gh.pr_ready, phase: Merge }
  - { id: await, kind: action, use: gh.issue_label, with: { state: awaiting-merge }, phase: Merge }
  - { id: merge_approval, kind: human, phase: Merge, prompt: "Merger la PR ?", choices: [approve] }
  - { id: merge, kind: action, use: gh.merge, phase: Merge }
  - { id: done, kind: action, use: gh.issue_label, with: { state: done }, phase: Merge }
  - { id: clean, kind: action, use: worktree.remove, phase: Nettoyage, on_error: warn }
