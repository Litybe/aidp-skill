# Game art development lane: pixel art asset issue to the `to-test` phase. Claim, worktree and branch, art-produce,
# devil's advocate art-review <-> art-fix loop, then STOP: the issue gets the `aidp:to-test` label and the ticket the
# `to-test` phase (`ticket.to_test`), the worktree is removed, the flow ends `done`. The branch and the draft PR stay pushed.
# The dispatcher then starts `game-test-art` (the `test_flow` of the route in routing.yaml) when the test lane of the project
# is free: the Unity test runs there, one issue at a time, in the main checkout.
# Workspace: the default one, a worktree per ticket (several dev flows run in parallel, up to `dispatcher.slots`). No Unity
# editor is open on a worktree: the stages do not run the compile gate nor the tests (`verification.compile = "deferred"`).
# Labels `aidp:*` are set by gh.issue_label, every review is commented on the issue (gh.issue_comment). A loop that runs out
# of rounds never blocks nor fails the run: the remaining findings stay open, commented on the issue (art dead-end rule). Loop `max` is a literal (the schema wants
# a u32); keep it equal to settings.max_review_rounds. `until` also stops the loop on settings.max_review_rounds so that the
# open-findings comment runs (a loop ended by `max` alone escalates the run at once, nothing after it runs).
# Start with POST /api/tickets/:key/flow {"flow": "game-art"}; the ticket track (`bug` writes the repro test first) reaches the pipelines by itself.
id: game-art
version: 1
inputs:
  ticket: { required: true }
settings:
  max_review_rounds: 2
steps:
  - { id: claim, kind: action, use: gh.issue_label, with: { state: in-progress }, phase: Préparation }
  - { id: worktree, kind: action, use: git.worktree, phase: Préparation }
  - { id: branch, kind: action, use: git.branch, phase: Préparation }
  - id: produce
    kind: pipeline
    use: art-produce
    phase: Réalisation
    pushes: true
  - id: review_loop
    kind: loop
    phase: Revue
    max: 2
    until: "steps.review.outputs.verdict == 'done' || !(steps.review_loop.iteration < settings.max_review_rounds) || (steps.review.outputs.verdict == 'need-fix' && steps.fix.outputs.pushed != true)"
    body:
      - { id: review_label, kind: action, use: gh.issue_label, with: { state: review } }
      - { id: review, kind: pipeline, use: art-review, pushes: false }
      - id: review_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Revue art-review : {{ steps.review.outputs.verdict }}", cost_footer: true }
        on_error: warn
      # The fix stage reads the review on the PR: the report goes there (unity-review posts its own GitHub review).
      - id: review_pr_comment
        kind: action
        use: gh.pr_comment
        with: { body: "review.md", body_dir: "{{ steps.review.outputs.runDir }}" }
        when: "steps.review.outputs.verdict == 'need-fix'"
        on_error: warn
      - id: fix
        kind: pipeline
        use: art-fix
        pushes: true
        when: "steps.review.outputs.verdict == 'need-fix'"
        with: { report_from: review }
  # A review that is not done after the last round is not a stop: the open findings go on the issue and the PR goes to test and to the human merge.
  - id: review_left_open
    kind: action
    use: gh.issue_comment
    phase: Revue
    with: { body: "Revue non convergée après {{ settings.max_review_rounds }} tours : les constats restants restent ouverts (voir la dernière revue et le corps de la PR). La PR continue vers le test, le merge humain tranche." }
    when: "steps.review.outputs.verdict != 'done'"
    on_error: warn
  - { id: to_test, kind: action, use: ticket.to_test, phase: Passage en test }
  - { id: clean, kind: action, use: worktree.remove, phase: Nettoyage, on_error: warn }
