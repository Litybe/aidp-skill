# Game art BUG lane: the fix of a bug issue raised by a failed test of a parent ticket (`bug.create` in `game-test-art`).
# The bug issue is a sub-issue of its parent, carries the labels `bug` and `bug:art` (routing.yaml: `pixelhood-bug-art`) and a body marker
# `<!-- aidp:bug parent=<n> base=feat/GH-<n> -->` that gives the mirror its base branch. Claim, worktree and branch (`fix/GH-<bug>`,
# created from `origin/feat/GH-<parent>`, never from the default branch), art-produce (the bug report is the demand),
# devil's advocate art-review <-> art-fix loop. The PR of the bug targets `feat/GH-<parent>`, never `main` (the pipelines read the
# `base_branch` input the daemon takes from the ticket).
# AUTOMATIC MERGE: when the review verdict is `done`, `gh.pr_ready` then `gh.merge` merge the PR into `feat/GH-<parent>` without a human
# click (`gh.merge` keeps its head check and its merge gate: a red gate or a moved head escalates the step). A loop that runs out of
# rounds without a `done` verdict never blocks nor fails the run: the open findings are commented, the PR is ready and the merge waits
# for a human approval (`merge_approval`). GitHub only closes an issue
# when its PR reaches the default branch, so `gh.issue_close` closes the bug after the merge: the parent, which waited on this open
# blocker, goes back to the test lane by itself. The final PR of the parent toward `main` stays the human's decision.
# Workspace: the default one, a worktree per ticket (dev lane, `dispatcher.slots`). No Unity editor is open on a worktree: the stages
# do not run the compile gate nor the tests (`verification.compile = "deferred"`); the parent's test lane runs them again.
# Loop `max` is a literal (the schema wants a u32); keep it equal to settings.max_review_rounds. The step ids `ready` and `merge` move
# the ticket status to in-review and done.
id: game-bug-art
version: 2
inputs:
  ticket: { required: true }
settings:
  max_merge_rounds: 2
  max_review_rounds: 2
steps:
  - { id: claim, kind: action, use: gh.issue_label, with: { state: in-progress }, phase: Préparation }
  - { id: worktree, kind: action, use: git.worktree, phase: Préparation }
  - { id: branch, kind: action, use: git.branch, phase: Préparation }
  - id: produce
    kind: pipeline
    use: art-produce
    phase: Réalisation
    pushes: true
  - id: review_loop
    kind: loop
    phase: Revue
    max: 2
    until: "steps.review.outputs.verdict == 'done' || !(steps.review_loop.iteration < settings.max_review_rounds) || (steps.review.outputs.verdict == 'need-fix' && steps.fix.outputs.pushed != true)"
    body:
      - { id: review_label, kind: action, use: gh.issue_label, with: { state: review } }
      - { id: review, kind: pipeline, use: art-review, pushes: false }
      - id: review_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Revue art-review : {{ steps.review.outputs.verdict }}", cost_footer: true }
        on_error: warn
      # The fix stage reads the review on the PR: the report goes there (unity-review posts its own GitHub review).
      - id: review_pr_comment
        kind: action
        use: gh.pr_comment
        with: { body: "review.md", body_dir: "{{ steps.review.outputs.runDir }}" }
        when: "steps.review.outputs.verdict == 'need-fix'"
        on_error: warn
      - id: fix
        kind: pipeline
        use: art-fix
        pushes: true
        when: "steps.review.outputs.verdict == 'need-fix'"
        with: { report_from: review }
  # Review not done after the last round: no block, no failure. The open findings are commented and the human merge decides.
  - id: review_left_open
    kind: action
    use: gh.issue_comment
    phase: Revue
    with: { body: "Revue non convergée après {{ settings.max_review_rounds }} tours : les constats restants restent ouverts (voir la dernière revue). Le merge attend une validation humaine." }
    when: "steps.review.outputs.verdict != 'done'"
    on_error: warn
  - { id: ready, kind: action, use: gh.pr_ready, phase: Merge }
  - { id: await, kind: action, use: gh.issue_label, with: { state: awaiting-merge }, phase: Merge, when: "steps.review.outputs.verdict != 'done'" }
  - { id: merge_approval, kind: human, phase: Merge, prompt: "Merger la PR avec des constats d'art ouverts ?", choices: [approve], when: "steps.review.outputs.verdict != 'done'" }
  # Merge with a conflict fallback: `gh.merge` reports `conflict: true` (the PR conflicts with its base and nothing else
  # closes its gate) instead of failing; the next round runs `merge-conflict` (Sonnet, effort low: merges the base into the PR
  # branch in its own worktree, pushes) and merges again. Still not merged after settings.max_merge_rounds: label `blocked`,
  # run escalated. Loop `max` is a literal: keep it equal to settings.max_merge_rounds.
  - id: merge_loop
    kind: loop
    phase: Merge
    max: 2
    until: "steps.merge.outputs.merged == true || !(steps.merge_loop.iteration < settings.max_merge_rounds)"
    body:
      - { id: merge_fix, kind: pipeline, use: merge-conflict, pushes: true, when: "steps.merge.outputs.conflict == true" }
      - { id: merge, kind: action, use: gh.merge }
  - { id: merge_blocked, kind: action, use: gh.issue_label, with: { state: blocked }, phase: Merge, when: "steps.merge.outputs.merged != true" }
  - { id: merge_escalate, kind: action, use: fail, phase: Merge, with: { kind: business, message: "Conflit de merge non résolu : issue bloquée" }, when: "steps.merge.outputs.merged != true" }
  - { id: done, kind: action, use: gh.issue_label, with: { state: done }, phase: Merge }
  - { id: close, kind: action, use: gh.issue_close, phase: Merge }
  - { id: clean, kind: action, use: worktree.remove, phase: Nettoyage, on_error: warn }
