# Game code delivery: GitHub issue to merged PR for a Unity game. Claim, implement, devil's
# advocate review <-> fix loop, Unity test <-> fix loop, human merge. Labels `aidp:*` are set by
# gh.issue_label, every review and test is commented on the issue (gh.issue_comment).
# The `unity-editor` resource serializes the steps that need the Editor (one holder at a time).
# Start with POST /api/tickets/:key/flow {"flow": "game-code"}; track `bug` writes the repro test first.
id: game-code
version: 1
inputs:
  ticket: { required: true }
  track: { required: false, default: standard }
settings:
  max_review_rounds: 2
  max_test_rounds: 2
steps:
  - { id: claim, kind: action, use: gh.issue_label, with: { state: in-progress }, phase: Préparation }
  - { id: worktree, kind: action, use: git.worktree, phase: Préparation }
  - { id: branch, kind: action, use: git.branch, phase: Préparation }
  - id: implement
    kind: pipeline
    use: unity-implement
    phase: Réalisation
    pushes: true
    resource: unity-editor
    with: { track: "{{ inputs.track }}" }
  - id: review_loop
    kind: loop
    phase: Revue
    max: 2
    until: "steps.review.outputs.verdict == 'done'"
    body:
      - { id: review_label, kind: action, use: gh.issue_label, with: { state: review } }
      - { id: review, kind: pipeline, use: unity-review, pushes: false }
      - id: review_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Revue unity-review : {{ steps.review.outputs.verdict }}", cost_footer: true }
        on_error: warn
      - id: fix
        kind: pipeline
        use: unity-fix
        pushes: true
        resource: unity-editor
        when: "steps.review.outputs.verdict == 'need-fix'"
        with: { report_from: review }
  - id: review_exhausted
    kind: action
    use: gh.issue_label
    phase: Revue
    when: "steps.review.outputs.verdict != 'done'"
    with: { state: blocked }
  - { id: review_escalate, kind: action, use: fail, phase: Revue, when: "steps.review.outputs.verdict != 'done'" }
  - id: test_loop
    kind: loop
    phase: Test Unity
    max: 2
    until: "steps.test.outputs.passed == true"
    body:
      - { id: test_label, kind: action, use: gh.issue_label, with: { state: testing } }
      - { id: test, kind: pipeline, use: unity-test, pushes: true, resource: unity-editor }
      - id: test_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Test unity-test : passed={{ steps.test.outputs.passed }}", cost_footer: true }
        on_error: warn
      - id: fix_test
        kind: pipeline
        use: unity-fix
        pushes: true
        resource: unity-editor
        when: "steps.test.outputs.passed == false"
        with: { report_from: test }
  - { id: ready, kind: action, use: gh.pr_ready, phase: Merge }
  - { id: await, kind: action, use: gh.issue_label, with: { state: awaiting-merge }, phase: Merge }
  - { id: merge_approval, kind: human, phase: Merge, prompt: "Merger la PR ?", choices: [approve] }
  - { id: merge, kind: action, use: gh.merge, phase: Merge }
  - { id: done, kind: action, use: gh.issue_label, with: { state: done }, phase: Merge }
  - { id: clean, kind: action, use: worktree.remove, phase: Nettoyage, on_error: warn }
