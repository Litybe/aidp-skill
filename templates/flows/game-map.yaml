# Game map development lane: LDtk rooms/world issue to the `to-test` phase. Claim, worktree and branch, map-produce,
# devil's advocate map-review <-> map-fix loop, then STOP: the issue gets the `aidp:to-test` label and the ticket the
# `to-test` phase (`ticket.to_test`), the worktree is removed, the flow ends `done`. The branch and the draft PR stay pushed.
# The dispatcher then starts `game-test-map` (the `test_flow` of the route in routing.yaml) when the test lane of the project
# is free: the Unity test runs there, one issue at a time, in the main checkout.
# Workspace: the default one, a worktree per ticket (several dev flows run in parallel, up to `dispatcher.slots`). No Unity
# editor is open on a worktree: the stages do not run the compile gate nor the tests (`verification.compile = "deferred"`).
# Labels `aidp:*` are set by gh.issue_label, every review is commented on the issue (gh.issue_comment). A loop that runs out
# of rounds sets `blocked` and ends the run `escalated` (`fail` with kind business). Loop `max` is a literal (the schema wants
# a u32); keep it equal to settings.max_review_rounds. `until` also stops the loop on settings.max_review_rounds so that the
# blocked label and the business `fail` run (a loop ended by `max` alone escalates the run at once, nothing after it runs).
# Start with POST /api/tickets/:key/flow {"flow": "game-map"}; the ticket track (`bug` writes the repro test first) reaches the pipelines by itself.
id: game-map
version: 1
inputs:
  ticket: { required: true }
settings:
  max_review_rounds: 2
# Forced moves (POST /api/tickets/:key/force): each entry lands on `step`, runs only the `keep` steps before it and
# assumes `outputs` for the skipped ones, so the conditions after it hold.
entries:
  review: { step: review_loop, keep: [worktree, branch] }
steps:
  - { id: claim, kind: action, use: gh.issue_label, with: { state: in-progress }, phase: Préparation }
  - { id: worktree, kind: action, use: git.worktree, phase: Préparation }
  - { id: branch, kind: action, use: git.branch, phase: Préparation }
  - id: produce
    kind: pipeline
    use: map-produce
    phase: Réalisation
    pushes: true
  - id: review_loop
    kind: loop
    phase: Revue
    max: 2
    until: "steps.review.outputs.verdict == 'done' || !(steps.review_loop.iteration < settings.max_review_rounds)"
    body:
      - { id: review_label, kind: action, use: gh.issue_label, with: { state: review } }
      - { id: review, kind: pipeline, use: map-review, pushes: false }
      - id: review_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Revue map-review : {{ steps.review.outputs.verdict }}", cost_footer: true }
        on_error: warn
      - id: fix
        kind: pipeline
        use: map-fix
        pushes: true
        when: "steps.review.outputs.verdict == 'need-fix'"
        with: { report_from: review }
  - { id: review_exhausted, kind: action, use: gh.issue_label, with: { state: blocked }, phase: Revue, when: "steps.review.outputs.verdict != 'done'" }
  - { id: review_escalate, kind: action, use: fail, phase: Revue, with: { kind: business, message: "Revue épuisée : issue bloquée" }, when: "steps.review.outputs.verdict != 'done'" }
  - { id: to_test, kind: action, use: ticket.to_test, phase: Passage en test }
  - { id: clean, kind: action, use: worktree.remove, phase: Nettoyage, on_error: warn }
