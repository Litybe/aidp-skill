# Game map delivery: LDtk rooms/world issue to merged PR.
# Claim, map-produce, map-review <-> map-fix loop, map-test <-> map-fix loop (Unity Editor), human merge.
# Labels `aidp:*` come from gh.issue_label, every review and test is commented on the issue
# (gh.issue_comment). A loop that runs out of rounds sets `blocked` and ends the run `escalated`.
# Loop `max` is a literal (the schema wants a u32); keep it equal to settings.max_*_rounds.
# Start with POST /api/tickets/:key/flow {"flow": "game-map"}.
id: game-map
version: 1
inputs:
  ticket: { required: true }
settings:
  max_review_rounds: 2
  max_test_rounds: 2
steps:
  - { id: claim, kind: action, use: gh.issue_label, with: { state: in-progress }, phase: Préparation }
  - { id: worktree, kind: action, use: git.worktree, phase: Préparation }
  - { id: branch, kind: action, use: git.branch, phase: Préparation }
  - { id: produce, kind: pipeline, use: map-produce, phase: Réalisation, pushes: true }
  - id: review_loop
    kind: loop
    phase: Revue
    max: 2
    until: "steps.review.outputs.verdict == 'done'"
    body:
      - { id: review_label, kind: action, use: gh.issue_label, with: { state: review } }
      - { id: review, kind: pipeline, use: map-review, pushes: false }
      - id: review_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Revue map-review : {{ steps.review.outputs.verdict }}", cost_footer: true }
        on_error: warn
      - id: fix
        kind: pipeline
        use: map-fix
        pushes: true
        when: "steps.review.outputs.verdict == 'need-fix'"
        with: { report_from: review }
  - { id: review_exhausted, kind: action, use: gh.issue_label, with: { state: blocked }, phase: Revue, when: "steps.review.outputs.verdict != 'done'" }
  - { id: review_escalate, kind: action, use: fail, phase: Revue, when: "steps.review.outputs.verdict != 'done'" }
  - id: test_loop
    kind: loop
    phase: Test Unity
    max: 2
    until: "steps.test.outputs.passed == true"
    body:
      - { id: test_label, kind: action, use: gh.issue_label, with: { state: testing } }
      - { id: test, kind: pipeline, use: map-test, pushes: true, resource: unity-editor }
      - id: test_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Test map-test : passed={{ steps.test.outputs.passed }}", cost_footer: true }
        on_error: warn
      - id: fix_test
        kind: pipeline
        use: map-fix
        pushes: true
        when: "steps.test.outputs.passed == false"
        with: { report_from: test }
  - { id: test_exhausted, kind: action, use: gh.issue_label, with: { state: blocked }, phase: Test Unity, when: "steps.test.outputs.passed != true" }
  - { id: test_escalate, kind: action, use: fail, phase: Test Unity, when: "steps.test.outputs.passed != true" }
  - { id: ready, kind: action, use: gh.pr_ready, phase: Merge }
  - { id: await, kind: action, use: gh.issue_label, with: { state: awaiting-merge }, phase: Merge }
  - { id: merge_approval, kind: human, phase: Merge, prompt: "Merger la PR ?", choices: [approve] }
  - { id: merge, kind: action, use: gh.merge, phase: Merge }
  - { id: done, kind: action, use: gh.issue_label, with: { state: done }, phase: Merge }
  - { id: clean, kind: action, use: worktree.remove, phase: Nettoyage, on_error: warn }
