# Game art test lane: the headless test of an issue whose development ended (phase `to-test`), then the merge.
# Started by the dispatcher (never by hand, except through POST /api/tickets/:key/start) as the `test_flow` of the route,
# when the test lane of the project is free: `dispatcher.test_slots` (1) test flows at a time per project.
# art-headless <-> art-fix loop (`report_from: test`), PR ready, human merge. Labels `aidp:*` are set by gh.issue_label, every
# test is commented on the issue (gh.issue_comment). A loop that runs out of rounds sets `blocked` and ends the run `escalated`
# (`fail` with kind business). Loop `max` is a literal (the schema wants a u32); keep it equal to settings.max_test_rounds.
# Workspace: the default one, a worktree per ticket, like the dev lane. NO Unity Editor, NO `unity-editor` resource, no
# `git.checkout` / `unity.refresh` / `git.restore`: the test is headless (checks on the files of the PR, no Unity), so the main
# checkout of the project stays free. Decision: art / map / doc tickets need no Unity Editor test; the Editor tests stay for
# the issues that change code (game-test-code).
# `git.worktree` then `git.branch` take the issue branch the dev flow pushed. CAUTION: `worktree.remove` of the dev flow deletes
# the local branch `feat/GH-<n>`, so `git.worktree` creates it again from the default branch and `git.branch` finds it local
# (no switch to origin). The first stage of art-headless therefore runs `git fetch` + `git merge --ff-only origin/<branch>`
# (blocked `branch-diverged` otherwise) before testing. The test commits and pushes the `.meta` files it creates
# (scripts/unity_meta.py), hence `pushes: true`; `worktree.remove` at the end saves any unpushed work and removes the worktree.
id: game-test-art
version: 1
inputs:
  ticket: { required: true }
settings:
  max_test_rounds: 2
steps:
  - { id: worktree, kind: action, use: git.worktree, phase: Préparation }
  - { id: branch, kind: action, use: git.branch, phase: Préparation }
  - id: test_loop
    kind: loop
    phase: Test
    max: 2
    until: "steps.test.outputs.passed == true || !(steps.test_loop.iteration < settings.max_test_rounds)"
    body:
      - { id: test_label, kind: action, use: gh.issue_label, with: { state: testing } }
      - { id: test, kind: pipeline, use: art-headless, pushes: true }
      - id: test_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Test art-headless : passed={{ steps.test.outputs.passed }}", cost_footer: true }
        on_error: warn
      - id: fix_test
        kind: pipeline
        use: art-fix
        pushes: true
        when: "steps.test.outputs.passed == false"
        with: { report_from: test }
  - { id: test_exhausted, kind: action, use: gh.issue_label, with: { state: blocked }, phase: Test, when: "steps.test.outputs.passed != true" }
  - { id: test_escalate, kind: action, use: fail, phase: Test, with: { kind: business, message: "Test épuisé : issue bloquée" }, when: "steps.test.outputs.passed != true" }
  - { id: ready, kind: action, use: gh.pr_ready, phase: Merge }
  - { id: await, kind: action, use: gh.issue_label, with: { state: awaiting-merge }, phase: Merge }
  - { id: merge_approval, kind: human, phase: Merge, prompt: "Merger la PR ?", choices: [approve] }
  - { id: merge, kind: action, use: gh.merge, phase: Merge }
  - { id: done, kind: action, use: gh.issue_label, with: { state: done }, phase: Merge }
  - { id: clean, kind: action, use: worktree.remove, phase: Nettoyage, on_error: warn }
