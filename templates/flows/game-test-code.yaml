# Game code test lane: the headless verification of an issue whose development ended (phase `to-test`), then PR ready.
# Started by the dispatcher (never by hand, except through POST /api/tickets/:key/start) as the `test_flow` of the route.
# unity-test <-> unity-fix loop (`report_from: test`), PR ready, label `awaiting-merge`, worktree removed, the flow ends
# `done`. Labels `aidp:*` are set by gh.issue_label, every test is commented on the issue (gh.issue_comment). A loop that
# runs out of rounds sets `blocked` and ends the run `escalated` (`fail` with kind business). Loop `max` is a literal (the
# schema wants a u32); keep it equal to settings.max_test_rounds.
# Workspace: the default one, a worktree per ticket (`git.worktree` then `git.branch`, which reuses the branch the dev flow
# pushed). No Editor is open on a worktree: unity-test runs Unity in batchmode there (compile gate C1, EditMode suite C8;
# templates/recipes/unity-verify.md). No `workspace: project`, no `unity-editor` resource: a test flow occupies a dev slot
# (`dispatcher.slots` bounds the Unity batchmode processes that run at once).
# No PlayMode here: the PR comment of unity-test carries the « À tester à la main en PlayMode » check-list. The human plays
# it, then merges the PR on GitHub; the dispatcher moves the ticket to `done` when it sees the PR merged.
id: game-test-code
version: 1
inputs:
  ticket: { required: true }
settings:
  max_test_rounds: 2
steps:
  - { id: worktree, kind: action, use: git.worktree, phase: Préparation }
  - { id: branch, kind: action, use: git.branch, phase: Préparation }
  - id: test_loop
    kind: loop
    phase: Test Unity
    max: 2
    until: "steps.test.outputs.passed == true || !(steps.test_loop.iteration < settings.max_test_rounds)"
    body:
      - { id: test_label, kind: action, use: gh.issue_label, with: { state: testing } }
      - { id: test, kind: pipeline, use: unity-test, pushes: false }
      - id: test_comment
        kind: action
        use: gh.issue_comment
        with: { body: "Test unity-test (headless) : passed={{ steps.test.outputs.passed }}", cost_footer: true }
        on_error: warn
      - id: fix_test
        kind: pipeline
        use: unity-fix
        pushes: true
        when: "steps.test.outputs.passed == false"
        with: { report_from: test }
  - { id: test_exhausted, kind: action, use: gh.issue_label, with: { state: blocked }, phase: Test Unity, when: "steps.test.outputs.passed != true" }
  - { id: test_escalate, kind: action, use: fail, phase: Test Unity, with: { kind: business, message: "Test épuisé : issue bloquée" }, when: "steps.test.outputs.passed != true" }
  - { id: ready, kind: action, use: gh.pr_ready, phase: Merge }
  - { id: await, kind: action, use: gh.issue_label, with: { state: awaiting-merge }, phase: Merge }
  - id: manual_comment
    kind: action
    use: gh.issue_comment
    phase: Merge
    with: { body: "PR prête. Reste à toi : le test manuel en PlayMode (check-list dans le dernier commentaire unity-test de la PR), puis le merge sur GitHub." }
    on_error: warn
  - { id: clean, kind: action, use: worktree.remove, phase: Nettoyage, on_error: warn }
