version: 5
id: fraud-local-dev
name: Dev — fraud-local-environment
description: >
  Pipeline dev pour ce repo (orchestration LocalStack/Docker de la stack locale
  Fraud : fraud-stack, fraud-gdpr-e2e, local-gateway, scripts *.sh). Politique de
  modèle délibérément low-cost : haiku partout par défaut, sonnet réservé à la
  synthèse de fin d'étude (`study`, qui clôt le discovery), et opus réservé au
  seul stage `plan` — une conception de plan est la chose qui mérite le modèle
  le plus cher ici, tout le reste (lecture, exécution, revue) ne le justifie pas.
inputs:
  jira_keys: { required: false, kind: list, default: [], description: "Une ou plusieurs US Jira de la MEME feature, en tableau JSON (ex. [\"SQIPI-1\",\"SQIPI-2\"])." }
  prompt: { required: false, kind: string, default: "", description: "Demande en texte libre si pas de ticket Jira : exactement UN de jira_keys / prompt doit etre non vide." }
  feature: { required: true, kind: string, description: "Nom de la feature : nomme la branche git (feat/<feature>) et le dossier du run." }
  track: { required: true, kind: enum, values: [quick, standard, deep], default: standard, description: "quick saute l'etude et le gate de plan ; standard fait les deux ; deep gate le plan pour validation humaine." }
settings:
  max_correction_iterations: 2
  knowledge_graph:
    enabled: true
    refresh: never
    code_only: true
stages:
  # Branche de feature fraîche sur master à jour, avant tout le reste.
  - name: prepare_branch
    agent: executor
    model: haiku
    skills: [git-branch-setup]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      branch: "feat/{{ feature }}"
    outputs: [branch.json]

  # Lecture pure : cartographie ce que la demande touche (scripts *.sh,
  # docker-compose.yaml des stacks, harness de scénarios). Pas de synthèse ici,
  # donc haiku suffit.
  - name: discover
    agent: analyzer
    model: haiku
    skills: [graphify-context, fraud-stack-local]
    needs: [prepare_branch]
    outputs: [context.md]

  # Synthèse de fin de discovery : transforme le contexte brut en note
  # d'exigences structurée (problème -> options -> recommandation). C'est le
  # SEUL moment, avec `plan`, où on paie plus que haiku.
  - name: study
    agent: analyzer
    skills: [study-synthesis]
    needs: [discover]
    outputs: [study.md]
    when: "{{ inputs.track != 'quick' }}"

  # plan.json : un objet par tâche, ses `needs`, son write set — c'est lui qui
  # décide la parallélisation de `implement`. Seul stage en opus.
  - name: plan
    agent: planner
    skills: [graphify-context, enforcing-decision-records, ticket-to-plan-aidp, fraud-stack-local]
    needs: [study]
    outputs: [plan.json, plan.md]
    gate: "{{ inputs.track == 'deep' }}"

  # Implémentation compilée depuis le plan (plan-driven, deux passes). Haiku :
  # exécuter un plan déjà pensé ne demande pas le modèle le plus cher.
  - name: implement
    agent: executor
    model: haiku
    skills: [git-push]
    needs: [plan]
    scope: { mode: repo_wide }
    isolation: worktree
    plan_tasks:
      from: "{{ stages.plan.outputs.plan }}"
      max: 4
      merge_hint: >
        Consolide les changements de fichiers partagés que les tâches ont
        délégués (docker-compose.yaml, scripts *.sh communs), puis écris le
        changed-files.json couvrant toutes les tâches.
    outputs: [changed-files.json]

  # Rejoue la suite de non-régression de la stack contre le changement, avant
  # la revue humaine — preuve sur une stack qui tourne vraiment plutôt qu'une
  # relecture à l'aveugle.
  - name: validate_stack
    agent: executor
    model: haiku
    skills: [fraud-stack-local]
    needs: [implement]
    scope: { mode: stage_dir_only }
    outputs: [stack-results.json]
    with:
      instructions: >-
        Lance la suite de non-régression pertinente (`localstack/regression.sh`
        ou `stack.sh test` selon la stack touchée). Écris stack-results.json :
        { exit_code, scenarios: [ { name, status } ], totals: { scenarios,
        passed, failed } }. Pose signals.has_blocking_findings = true si au
        moins un scénario est rouge.

  - name: review
    agent: reviewer
    model: haiku
    skills: [code-review-aidp, code-audit-rubric]
    needs: [implement, validate_stack]
    inputs:
      stack_results: "{{ stages.validate_stack.outputs.stack-results }}"
    scope: { mode: stage_dir_only }
    outputs: [findings.json, summary.md]

  - name: correction_loop
    type: loop
    when: "{{ stages.review.outputs.summary.has_blocking_findings or stages.validate_stack.outputs.stack-results.totals.failed > 0 }}"
    max_iterations: "{{ settings.max_correction_iterations }}"
    body:
      # Reprise de plan = un delta sur un plan déjà écrit, pas une conception :
      # reste en haiku, opus est réservé au plan initial.
      - name: replan
        agent: planner
        model: haiku
        with: { mode: correction }
        inputs:
          findings: "{{ stages.review.outputs.findings }}"
          stack_results: "{{ stages.validate_stack.outputs.stack-results }}"
      - name: refix
        agent: executor
        model: haiku
        scope: { mode: repo_wide }
        needs: [replan]
      - name: retest_stack
        agent: executor
        model: haiku
        skills: [fraud-stack-local]
        needs: [refix]
        outputs: [retest-results.json]
        scope: { mode: stage_dir_only }
      - name: rereview
        agent: reviewer
        model: haiku
        skills: [code-review-aidp]
        needs: [retest_stack]
        outputs: [findings.json, summary.md]

  - name: pr
    agent: executor
    model: haiku
    skills: [git-push, writing-clearly-and-concisely]
    needs: [review, validate_stack]
    inputs:
      stack_results: "{{ stages.validate_stack.outputs.stack-results }}"
    scope: { mode: stage_dir_only }
    with:
      instructions: >-
        Ouvre la PR comme d'habitude, avec une section « Vérifié en local » qui
        reprend le verdict de validate_stack (N scénarios / M passés) et ce que
        ce run NE prouve PAS.
