version: 5
id: pixelart
description: >
  Pixel art production at studio quality with five specialised agents:
  pixel-art-director (brief: format, palette ramps, light, pose-by-pose
  animation plan with ms timings, priced Pixellab plan, acceptance criteria),
  pixel-artist (best Pixellab tool, palette lock, AI-defect checks, Aseprite
  import), pixel-animator (Pixellab animation + Aseprite timing, holds, anchor,
  loops, anti-boil; pass-through for static assets), pixel-reviewer (measures,
  scored critique, localised findings) and pixel-fixer (hand cleanup in
  Aseprite, Unity export, save back to Pixellab), then a final recheck.

  Covers the nine needs of the pixellab skill: item, item animation,
  character, character animation, UI element, UI animation, tileset, tileset
  animation and map assets (biome mockup + tileset + props; the LDtk layout
  itself belongs to the map-create skill). Palette Rosy 42 by default.

  Needs the MCP servers `pixellab` and `aseprite`, the skills `pixellab`,
  `pixel-art`, `pixel-palette`, `pixel-character`, `pixel-animation`,
  `pixel-tileset` and `pixel-review`, and the agents pixel-art-director,
  pixel-artist, pixel-animator, pixel-reviewer and pixel-fixer under
  ~/.claude/agents. max_cost is the user's spending approval for the run. If
  Pixellab refuses for lack of generations, the run reports blocked: check
  get_balance, then the pixellab skill's scripts/rotate_secret.py, restart
  Claude Code and resume.
inputs:
  prompt: { required: true, kind: string, description: "What to produce: subject, style, pose, mood, motion (for animations)." }
  asset_kind: { required: false, kind: enum, values: [item, item_animation, character, character_animation, ui, ui_animation, tileset, tileset_animation, map_assets, image], default: character, description: "Need to cover; selects the Pixellab tools (pixellab skill table) and the review rubric." }
  source: { required: false, kind: string, default: "", description: "Existing asset to start from or animate: a Pixellab ref (character:<id>, object:<id>, tileset:<id>, job:<id>, gallery:<id>) or a PNG path in the project. Empty: generate from the prompt." }
  style_ref: { required: false, kind: string, default: "", description: "Style anchor reused for consistency (validated asset ref or PNG path). Empty: none, or the first asset of the run." }
  view: { required: false, kind: enum, values: [side, low top-down, high top-down], default: side, description: "Camera view; side for the platformer projects." }
  size: { required: false, kind: string, default: "", description: "Canvas / tile size (e.g. 32x32, tile 16). Empty: take it from mcp__aseprite__project_profile." }
  palette: { required: false, kind: string, default: "rosy-42", description: "Palette name in the pixellab skill assets/ (<name>.json, .gpl, .dataurl.txt) or a .gpl/.hex path. Every pixel must end on it." }
  feature: { required: false, kind: string, description: "Asset label; names the vault run folder." }
  max_cost: { required: false, kind: int, default: 30, description: "Maximum Pixellab generations this run may spend (user approval). Above it, stop and report." }
settings:
  knowledge:
    enabled: true
    route: art
  knowledge_graph:
    enabled: false
stages:
  - name: brief
    description: Art direction - production brief, palette ramps, animation plan, priced Pixellab plan, acceptance criteria.
    agent: pixel-art-director
    model: opus
    skills: [pixellab, pixel-art, pixel-palette, pixel-animation, pixel-character, pixel-tileset]
    scope: { mode: stage_dir_only }
    policy:
      - "Never ask the user a question; decide open points and record them as assumptions."
      - "No paid Pixellab call and no sprite edit: only free tools (get_balance, get_pro_flash_capabilities, get_*, pixelart_workbench inspect/score)."
      - "The priced plan must fit max_cost; if even the minimal plan does not, report blocked with the cheapest viable plan."
    inputs:
      prompt: "{{ inputs.prompt }}"
      asset_kind: "{{ inputs.asset_kind }}"
      source: "{{ inputs.source }}"
      style_ref: "{{ inputs.style_ref }}"
      view: "{{ inputs.view }}"
      size: "{{ inputs.size }}"
      palette: "{{ inputs.palette }}"
      max_cost: "{{ inputs.max_cost }}"
    with:
      instructions: >
        Write brief.json and art-brief.md as your agent definition says: use
        in game and background, view, canvas / tile size, palette ramps per
        material picked from the palette, light, outline, colour budget,
        silhouette and focal point, the pose-by-pose animation plan with ms
        per frame when asset_kind ends with _animation, the Pixellab plan
        (tool, parameters, exact English prompt, seed, cost) and the
        acceptance criteria of pixellab/references/pro-standards.md.
    outputs: [brief.json, art-brief.md]

  - name: generate
    description: Generate the base asset with the best Pixellab tool, lock it on the palette and import it into Aseprite.
    agent: pixel-artist
    model: opus
    needs: [brief]
    skills: [pixellab, pixel-art, pixel-palette, pixel-character, pixel-tileset]
    scope: { mode: production }
    policy:
      - "Never ask the user a question; decide open points and record them as assumptions. max_cost is the approval: no cost confirmation is needed below it."
      - "Use the brief's Pixellab plan and the pixellab skill's best tools; never standard, pixflux, bitforge or legacy endpoints."
      - "Price every call before submitting it; never exceed max_cost in total. Wait with wait_for_jobs; retry a failed or unusable job at most once."
      - "Pass images as references (upload:, URLs, character:/object:/job:), never long base64; read palette data URLs from the assets file."
      - "No hand pixel edits in this stage except format fixes (canvas, tags, import)."
    inputs:
      brief: "{{ stages.brief.outputs.brief }}"
      asset_kind: "{{ inputs.asset_kind }}"
      source: "{{ inputs.source }}"
      max_cost: "{{ inputs.max_cost }}"
    with:
      instructions: >
        Produce the static base of the asset (for an *_animation kind: the
        item, character, UI element or tile to animate; reuse source when
        given). Check every result (inspect, score, lint, AI defects), lock
        the palette (reduce_colors + save_to_asset) when off-palette or score
        < 85, download into the stage dir, import into an .aseprite in the
        project's sprite folder with the palette .gpl loaded, and write
        generation.json.
    outputs: [generation.json]

  - name: animate
    description: Animate the asset per the brief (Pixellab + Aseprite timing); pass-through for a static asset.
    agent: pixel-animator
    model: opus
    needs: [generate]
    skills: [pixel-animation, pixellab, pixel-art, pixel-palette]
    scope: { mode: production }
    policy:
      - "Never ask the user a question; record choices as assumptions."
      - "Static asset_kind (no _animation suffix): write asset.json from generation.json with animated false and call no tool."
      - "Spend only what is left of max_cost after the generate stage. Every animation ends on the palette, with ms timings, holds, a stable anchor and a clean loop."
    inputs:
      brief: "{{ stages.brief.outputs.brief }}"
      generation: "{{ stages.generate.outputs.generation }}"
      asset_kind: "{{ inputs.asset_kind }}"
      max_cost: "{{ inputs.max_cost }}"
    with:
      instructions: >
        Follow the brief's animation plan: Pixellab animation with the best
        mode, palette lock of all frames in one reduce_colors call, then
        Aseprite finishing (tags, per-frame ms, holds, anchor, anti-boil,
        loop, control GIF). Write asset.json.
    outputs: [asset.json]

  - name: verify
    description: Scored studio-level review of the asset against the brief and the pro standards.
    agent: pixel-reviewer
    model: sonnet
    needs: [animate]
    skills: [pixel-review, pixel-animation, pixel-palette, pixellab]
    scope: { mode: stage_dir_only }
    policy:
      - "Read only: never modify the sprite, never call a paid Pixellab tool."
      - "Finding defects is success: reply completed once findings.json is written and re-read."
    inputs:
      brief: "{{ stages.brief.outputs.brief }}"
      asset: "{{ stages.animate.outputs.asset }}"
      asset_kind: "{{ inputs.asset_kind }}"
    with:
      instructions: >
        Measure (sprite_inspect, sprite_stats, lint with the palette, anim_audit
        per tag, unity_validate, workbench score), look (1x on the game
        background, zoomed grid, strip/onion/diff for animations), score the
        grid, hunt the AI defects, and write findings.json (with verdict) and
        verify.md. Mirror verdict.fix_needed as the strict boolean
        signals.fix_needed: the correction loop reads it there.
    outputs: [findings.json, verify.md]

  # Hand correction then recheck, up to two rounds, while the review says fix_needed (signals.fix_needed).
  # recheck replaces verify's result; still fix_needed after two rounds -> the run pauses for a human.
  - name: correction
    type: loop
    when: "{{ stages.verify.outputs.findings.fix_needed }}"
    max_iterations: 2
    body:
      - name: fix
        agent: pixel-fixer
        model: opus
        skills: [pixel-review, pixel-art, pixel-palette, pixel-animation, pixel-character, pixel-tileset, pixellab]
        scope: { mode: production }
        policy:
          - "Correct by hand with the Aseprite MCP, in the existing style, on the palette; never rescale, blur or filter."
          - "Allowed Pixellab calls: free ones (pixelart_workbench, save_to_asset, get_*) and 0.1-generation cleanups within what is left of max_cost. No new generation."
          - "Fix findings from blocking to minor; skip one only with a written reason."
        inputs:
          brief: "{{ stages.brief.outputs.brief }}"
          asset: "{{ stages.animate.outputs.asset }}"
          findings: "{{ stages.verify.outputs.findings }}"
          max_cost: "{{ inputs.max_cost }}"
        with:
          instructions: >
            Fix each finding with the tool it names, re-measure, export for
            Unity (sheet + JSON, pivot/slices per the profile, control GIFs),
            save the corrected frames back to Pixellab, and write fix.json.
        outputs: [fix.json]
      - name: recheck
        agent: pixel-reviewer
        model: sonnet
        needs: [fix]
        skills: [pixel-review, pixel-animation, pixellab]
        scope: { mode: stage_dir_only }
        policy:
          - "Read only. Re-run the measures and the 1x look on the corrected asset; report what is still open."
        inputs:
          brief: "{{ stages.brief.outputs.brief }}"
          asset: "{{ stages.animate.outputs.asset }}"
          fix: "{{ stages.fix.outputs.fix }}"
        with:
          instructions: >
            Same review as the verify stage on the corrected sprite and its
            export; write findings.json and recheck.md, and set
            signals.fix_needed (strict boolean) as in verify. Remaining
            blocking findings mean the asset is not deliverable: say which
            Pixellab call would regenerate it.
        outputs: [findings.json, recheck.md]
