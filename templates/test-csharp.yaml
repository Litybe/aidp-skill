version: 5
id: test-csharp
description: >
  Write tests only (no production code changes) for an existing feature/ticket
  in a Betclic C#/.NET service: unit tests (xUnit) and integration/functional
  tests (Reqnroll BDD — Features/*.feature + StepDefinitions). If the repo has
  no Reqnroll suite yet, the integration shard bootstraps one from scratch
  (packages, reqnroll.json, Support/ harness) rather than skipping it. Tracks
  via track = quick | standard | deep. Composed from the reusable
  `dev-discovery` / `review` sub-pipelines — same context-gathering and
  rubric-review stages as `dev-csharp` — with the production `code` stage
  dropped: `tests` is the pipeline's sole deliverable, fanned out across a
  unit shard and an integration shard.

  DEMAND: Jira OR prompt. Pass `jira_keys` to drive the run from tickets, or
  `prompt` to drive it from a plain-text request with no ticket at all (then
  `feature` is required - it names the branch, the vault folder and the PR).
  `dev-discovery` resolves the two into the same requirements note at compile
  time, so everything from `plan` onwards is byte-identical between the modes.
inputs:
  # --- DEMAND. Exactly one of `jira_keys` / `prompt` must be non-empty; the
  # pipeline is identical downstream of `discover` either way.
  #
  # Mode A (Jira): one or more Jira US of the SAME feature (unitary US slicing).
  # A single US is a one-element list. Discovery reads them all; one plan, one
  # branch, one PR.
  jira_keys: { required: false, kind: list, default: [], description: "Une ou plusieurs US Jira de la MEME feature, en tableau JSON (ex. [\"SQIPI-1\",\"SQIPI-2\"])." }
  # Mode B (prompt): the request in plain text, with no ticket behind it -
  # `discover_prompt` turns it into the same requirements note `discover_jira`
  # would have produced, so `plan` / `tests` / `review` / `pr` are unchanged.
  # In this mode `feature` is REQUIRED: nothing else can name the branch
  # (`tests/{{ feature }}`), the vault folder or the PR.
  prompt: { required: false, kind: string, default: "" }
  # Feature/epic label → the run's grouping folder and branch name. Optional in
  # Jira mode (derived from the ticket list), required in prompt mode.
  feature: { required: false, kind: string, description: "Nom de la feature : alimente run::feature_key (sa PREMIERE branche testee) - decide le nom de la branche git ET le dossier du vault Obsidian pour ce run." }
  track: { required: true, kind: enum, values: [quick, standard, deep], default: standard, description: "Profondeur du run : quick saute l'etude et le gate de plan, standard fait les deux, deep gate le plan pour validation humaine avant la moindre ligne ecrite." }
settings:
  max_correction_iterations: 2
  knowledge_graph:
    enabled: true
    refresh: never
    code_only: true
stages:
  # First step: cut a fresh branch off an up-to-date master so every later
  # stage writes test files, commits and the PR land on tests/<feature>, never
  # on master. `{{ feature }}` = epic label if given, else derived from the US
  # list. The 3 context reads `needs` it → it runs alone, before the fan-out.
  - name: prepare_branch
    agent: executor
    skills: [git-branch-setup]
    inputs:
      jira_keys: "{{ inputs.jira_keys }}"
      branch: "tests/{{ feature }}"
    outputs: [branch.json]
    when: "true"

  # Context-gathering + study, composed from the reusable `dev-discovery`
  # sub-pipeline (demand ‖ discover_confluence ‖ discover_code →
  # discover → study), where "demand" is `discover_jira` or `discover_prompt`
  # depending on which input is non-empty (the other is dropped at compile
  # time). `needs: [prepare_branch]` cascades onto its root
  # stages, reproducing the same parallel fan-out as dev-csharp. Output
  # aliases keep the canonical names `context`/`study` addressable as
  # `stages.discover.outputs.*`.
  - name: discover
    type: pipeline
    uses: dev-discovery
    needs: [prepare_branch]
    with:
      jira_keys: "{{ inputs.jira_keys }}"
      prompt: "{{ inputs.prompt }}"
      track: "{{ inputs.track }}"
    outputs:
      - { name: context, from: discover.context }
      - { name: study, from: study.study }

  # `plan.json` (schema/plan.schema.json) is the machine contract: ONE OBJECT PER
  # TASK - prompt, instructions, `needs` (real dependencies) and `files` (the
  # task's write set). `aidp` compiles the implementation stage from it, so the
  # run's parallelism is decided here, by how the work is sliced into file-disjoint
  # tasks. The contract itself is injected into this stage's prompt by the emitter.
  # `plan.md` stays the human narrative (design, risks, rollback).
  - name: plan
    agent: planner
    skills: [graphify-context, reqnroll-testing-aidp, ticket-to-plan-aidp]
    needs: [discover]
    with: { mode: feature }
    outputs: [plan.json, plan.md]
    gate: "{{ inputs.track == 'deep' }}"

  # Sole deliverable of this pipeline: the test phase, compiled from the planner's
  # `plan.json`. `kinds: [tests]` means this stage claims only the plan's test
  # tasks - a task of any other kind is reported as not-run in the log, never
  # silently dropped. One sub-agent per test task, in parallel wherever their
  # write sets are disjoint, then a merge sub-agent that runs the FULL suite once.
  #
  # TWO-PASS stage: the first `workflow emit` stops here (`awaiting_plan`); the
  # second one, after the planner wrote the file, compiles the tasks and the tail.
  - name: tests
    agent: executor
    skills: [graphify-context, feature-testing-aidp, reqnroll-testing-aidp, csharp-dev-aidp]
    needs: [plan]
    scope: { mode: tests }
    plan_tasks:
      from: "{{ stages.plan.outputs.plan }}"
      max: 4
      kinds: [tests]
      merge_hint: >
        Run the FULL `rtk dotnet test` suite once, every test project included. If a
        task bootstrapped a new `fraud.<PROJECT>.functional.tests` project, add it
        to the .sln and confirm build/test discover it. Fix failures and write the
        consolidated changed-files.json covering every task.
    outputs: [changed-files.json]

  # Review, composed from the reusable `review` sub-pipeline (4 rubric
  # dimensions in parallel → synthesis). `needs: [tests]` cascades onto its 4
  # root dimension stages, reproducing the same parallel fan-out as
  # dev-csharp. Output aliases keep the canonical names `findings`/`summary`
  # addressable, so correction_loop and pr below are unchanged.
  - name: review
    type: pipeline
    uses: review
    needs: [tests]
    outputs:
      - { name: findings, from: review.findings }
      - { name: summary, from: review.summary }

  - name: correction_loop
    type: loop
    when: "{{ stages.review.outputs.findings.has_blocking_findings }}"
    max_iterations: "{{ settings.max_correction_iterations }}"
    body:
      - { name: replan, agent: planner, model: sonnet, with: { mode: correction }, inputs: { findings: "{{ stages.review.outputs.findings }}" } }   # delibere : une reprise de plan est un delta, pas une conception - opus serait surpaye
      - { name: refix, agent: executor, skills: [graphify-context, feature-testing-aidp, reqnroll-testing-aidp, csharp-dev-aidp], scope: { mode: tests }, needs: [replan] }
      - { name: rereview, agent: reviewer, skills: [graphify-context, code-review-aidp], needs: [refix], outputs: [findings.json, summary.md] }

  - name: pr
    agent: executor
    skills: [git-push, writing-clearly-and-concisely, teams-pr-notification]
    needs: [review]
    scope: { mode: stage_dir_only }
    outputs: [pr.json]
    gate: true
