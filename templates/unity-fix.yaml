version: 5
id: unity-fix
description: >
  Fix a Unity PR after a review or a failed Unity test, then push. prepare →
  plan → fix. `report_from: review` (default): the points ❌ / ⚠️ of the last
  devil's advocate review (`unity-review`) and the unresolved review threads,
  agent and human. `report_from: test`: the scenarios and tests reported KO by
  the last `unity-test` comment of the PR. Either way: fix with the
  unity-csharp-dev rules, compile gate C1 (the Editor stays open, no
  batchmode), tests, push on the PR's branch, answer on every thread (review
  mode) and post one `unity-fix-summary` comment. A fix never weakens a test
  or a scenario to make it pass.

  Used twice by the `game-code` flow: in the review ⇄ fix loop, then in the
  test ⇄ fix loop. The PR stays a draft: `ready` and the merge belong to the
  flow.

  Outputs read by the flows (C4): `pr` (number), `branch`, `summary`, in
  result.json of the fix stage (fix.json holds the details).

  Agent: unity-review-fixer. Shared recipe: templates/recipes/unity-verify.md.
  Editor open but file bridge silent: the stage ends `blocked: unity-editor`. In the review
  loop of a dev flow (`report_from: review`, worktree, no editor open on `projectRoot`:
  templates/recipes/unity-verify.md §0.0) the stage runs no C1 and no C8, reports
  `verification.compile = "deferred"` and never blocks for that. `report_from: test` runs in the
  main checkout of the test lane, editor open: compile gate and tests as before.
inputs:
  issue: { required: false, kind: string, default: "", description: "GitHub issue number; the PR linked to it is fixed." }
  pr: { required: false, kind: string, default: "", description: "PR number. Empty: the PR linked to `issue`, else the open PR of the current branch." }
  report_from: { required: false, kind: enum, values: [review, test], default: review, description: "What to fix: review = the ❌/⚠️ points and open threads of the last unity-review; test = the KO scenarios and tests of the last unity-test comment." }
  base_branch: { required: false, kind: string, default: "", description: "Branch the ticket starts from and its PR targets, when it is not the default one (a bug ticket: its parent's branch). Empty: the default branch." }
  feature: { required: false, kind: string, description: "Feature or ticket label; names the vault run folder." }
settings:
  knowledge_graph:
    enabled: false
stages:
  - name: prepare
    agent: executor
    model: haiku
    scope: { mode: stage_dir_only }
    policy:
      - "Base branch: context.baseBranch is the input `base_branch` when it is not empty (a bug ticket starts from its parent's branch and its PR targets it), else the repository default branch. Never fall back to the default branch when `base_branch` is set."
      - "Never ask the user a question. Decide open points yourself and record them as assumptions."
      - "Read only: no commit, no push, no branch switch, no GitHub write. Do not open or compile Unity."
    inputs:
      issue: "{{ inputs.issue }}"
      pr: "{{ inputs.pr }}"
      report_from: "{{ inputs.report_from }}"
      base_branch: "{{ inputs.base_branch }}"
    with:
      instructions: >
        (1) The working directory must hold Assets/ and ProjectSettings/;
        otherwise blocked. (2) `rtk gh repo view --json
        nameWithOwner,defaultBranchRef`. (3) Read .claude/unity-workflow.json
        and fill the defaults of
        ~/.claude/skills/unity-issue-workflow/references/config.md. (4) The
        PR: `pr` when given; else the PR linked to `issue`
        (references/github.md); else the open PR of the current branch. None
        found, closed or merged: blocked. (5) The issue: `issue`, else the
        `Closes #<n>` of the PR body. (6) `rtk git status --porcelain`, ignoring untracked *.meta and what the Unity Editor rewrites alone (Packages/packages-lock.json, ProjectSettings/, UserSettings/), not
        empty: blocked. The current branch must be the PR head; otherwise
        blocked (the flow checks it out). (7) What to fix, by `report_from`.
        review: the unresolved review threads (references/github.md, « Lire
        les fils non résolus »), the ❌ / ⚠️ rows of the « À corriger » list of
        the last review whose body contains `unity-review-summary` that no
        `unity-fix-summary` comment answered yet, and the general PR
        comments of a human posted after that review. test: the last PR
        comment containing `<!-- unity-test` (its rows with result `fail`:
        scenario or test id, criterion CA-n, expression, actual value,
        message), plus the unresolved threads. Count the items
        (`open_items`, `has_open_items`). (8) Fix round: 1 + the number of PR
        comments containing `unity-fix-summary`. Write context.json with
        repo, projectRoot, baseBranch, branch (the PR head), branch_exists:
        true, issue, pr, report_from, fix_round, items [{id, kind
        thread|review-point|test-ko, ref, text, severity, file, line}],
        open_items, has_open_items, open_blocking (items of severity
        bloquant) and config.
        Add to context.json: previous_fix (only when fix_round > 1: the body of the last PR comment containing `unity-fix-summary` and its ⏸️ rows, i.e. the items left open and why), and `plan_inputs` {issue_criteria: the acceptance criteria (CA-n) of the issue, pr_diff_hint: `rtk gh pr diff <pr> --name-only`}.
        Memory (contract C10, templates/recipes/memory.md of the skill): with the issue number, run `rtk aidp memory context --project "<projectRoot>" --issue GH-<issue> --route code --stage plan --budget 2000` (without an issue, drop `--issue`) and save its output as memory-context.md in your stage dir, unchanged; if the command fails, write memory-context.md holding only « Mémoire indisponible : <cause> » and go on. Read the BIBLE by its index (00_INDEX) and get any passage you need with `rtk aidp rag search "<query>" --project "<projectRoot>" --source bible --budget 1500`, never whole.
    outputs: [context.json, memory-context.md]

  - name: plan
    agent: planner
    model: opus
    skills: [unity-csharp-dev]
    needs: [prepare]
    scope: { mode: stage_dir_only }
    policy:
      - "Read only: no file edit outside the stage dir, no git that writes (commit, push, checkout, reset), no GitHub write (comment, review, label), no Pixellab or Unity call that changes anything."
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so. Rules: templates/recipes/memory.md."
      - "Never ask the user a question. Decide open points yourself and record them as assumptions."
      - "Every blocking or major item of `context.items` gets at least one step (finding_ids, exact file, symbol or asset, precise change, how to verify). An item not to fix (false positive, out of scope) is listed in `out_of_scope` with its reason."
      - "Round 2 and later (`context.fix_round` > 1): read `context.previous_fix`, say why the last fix left items open, and change the approach. Never repeat a step that failed the same way."
      - "Never plan to weaken a criterion, test or scenario, and never plan work outside the issue and the PR."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      instructions: >
        Plan the fix of the items of `context.items`; `context.has_open_items` false: write an empty plan (steps []) and stop. Read the PR diff
        (`rtk gh pr diff <pr>`), the issue and its criteria
        (`rtk gh issue view <issue> --comments`), `context.previous_fix` and
        the files each item points to. Unity: name the class, method or asset, and the C# change (signature, value). Say when the change needs the compile gate C1 or an EditMode test, and which. A `test-ko` item: plan the code fix, never the expectation. Write fix-plan.json
        {"steps": [{"finding_ids": [], "files": [], "change": "", "verification": ""}],
        "risks": [], "out_of_scope": [{"finding_ids": [], "reason": ""}]} and
        plan.md (same content, readable: one section per step, then
        risks and out of scope; from round 2 a first section « Pourquoi le
        tour précédent a échoué »). Steps in execution order, most serious
        first. No code, no edit of the repo. Reply completed with signals
        steps (count) and out_of_scope (count).
    outputs: [plan.md, fix-plan.json]

  - name: fix
    agent: unity-review-fixer
    model: sonnet
    skills: [unity-csharp-dev]
    needs: [prepare, plan]
    scope: { mode: repo_wide }
    policy:
      - "Follow `plan` step by step, in order. Report every step (done, or skipped with its reason) in fix.json `plan_steps`. Never widen the scope beyond the plan; a gap in the plan is reported, not improvised."
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "Memory proposals: write memory-proposals.json (`{\"proposals\": []}` when nothing qualifies), 5 max, non-obvious reusable lessons only. Rules: templates/recipes/memory.md §3."
      - "Each proposal has only these fields: kind (decision|convention|lesson|gotcha|preference|fact), title (120 chars max), text (600 chars max), scope {route, paths, tags}, refs, confidence (0 to 1). Never type, name, description, body or lesson."
      - "The PR exists: never open a new one, never merge, never mark it ready."
      - "The Unity Editor stays open: never run Unity in batchmode, never close it, never change branch."
      - "Scenarios use the PlaytestArena scene (no Level_* in `scene`) and `spawn` for test objects; never modify a Level_* for a test (unity-verify.md §3)."
      - "Never weaken, skip or delete a test or a PlaytestDriver scenario to make it pass; a scenario that is wrong is fixed only with the evidence in the report and said in the summary."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      plan: "{{ stages.plan.outputs.fix-plan }}"
      task: >
        `context.has_open_items` false: nothing to fix. Write fix.json with
        pushed false, commits [], items [], touched [], write result.json
        with the pr, branch and a summary « rien à corriger », post nothing
        on GitHub, and reply completed with signals pushed false,
        items_fixed 0, items_open 0, open_blocking 0. Otherwise follow `plan` (fix-plan.json, readable in plan.md) step by step, in order, and fix, from
        the most serious to the least, every item of `context.items`
        (`context.report_from` says whether they come from the review or from
        a failed Unity test), within the scope of the issue and the rules of
        unity-csharp-dev, as your section « Lancé par aidp » says. For a
        `test-ko` item: reproduce it from its expression and actual value,
        fix the code (or the missing probe or command of
        Assets/Scripts/Playtest/), never the expectation. After every batch of
        edits run the compile gate C1 and the EditMode tests as
        templates/recipes/unity-verify.md §1-§2 say; a fix that does not
        compile is not pushed. Editor open but file bridge silent: reply blocked, « blocked:
        unity-editor ». Editor not open on projectRoot (review loop in a worktree, deferred mode,
        §0.0): no C1, no C8, no blocked; re-read your edits with care, set "compile": "deferred",
        "tests": "deferred" in fix.json Commit (`fix(review|test): ... (#<issue>)`), push on the
        PR's branch (never force), reply on EACH review thread with what you
        did and the commit, resolve the fixed ones, leave a thread open with
        the reason when you did not fix it (wontfix with evidence, or
        blocked). Post ONE PR comment marked `unity-fix-summary` (round
        `context.fix_round`): the table item / status (✅ fixed, ⏸️ left) /
        evidence (commit, file:line, test), then « Reste manuel ». Items you
        could not verify without Play Mode go to « Reste manuel », not
        invented. Write fix.json: {"pushed", "plan_steps": [{index, finding_ids, status done|skipped, reason}], "commits", "items": [{id,
        status, evidence}], "fixed_refs", "touched" (the behaviours your fixes
        changed, one line each, for the next unity-test), "open_blocking",
        "compile": {ok, warnings, durationMs}, "tests": {total, failed}} and
        result.json, the file the flows read: {"pr": <number>, "branch":
        "<PR head>", "summary": "<two sentences: what was fixed, what is
        left>", "pushed": <bool>, "items_fixed": <n>, "items_open": <n>}.
        Mirror pushed, items_fixed, items_open, open_blocking as signals.
    outputs: [fix.json, result.json, memory-proposals.json]
