version: 5
id: unity-fix
description: >
  Fix a Unity PR after a review or a failed Unity test, then push. prepare →
  fix. `report_from: review` (default): the points ❌ / ⚠️ of the last
  devil's advocate review (`unity-review`) and the unresolved review threads,
  agent and human. `report_from: test`: the compile errors and the EditMode
  tests reported KO by the last `unity-test` comment of the PR. Either way:
  fix with the unity-csharp-dev rules, compile gate C1 and EditMode suite C8
  in batchmode in the ticket's worktree (templates/recipes/unity-verify.md),
  push on the PR's branch, answer on every thread (review mode) and post one
  `unity-fix-summary` comment. A fix never weakens a test to make it pass.
  Never PlayMode: what only PlayMode can show is left to the human, in the
  « Test manuel en PlayMode » section of the PR body, kept up to date.

  Used twice by the `game-code` flow: in the review ⇄ fix loop, then in the
  test ⇄ fix loop. The PR stays a draft: `ready` and the merge belong to the
  flow.

  Outputs read by the flows (C4): `pr` (number), `branch`, `summary`, in
  result.json of the fix stage (fix.json holds the details).

  Agent: unity-review-fixer. Shared recipe: templates/recipes/unity-verify.md.
  No Unity executable, another version than the project, no license, a timeout or an Editor
  already open on the worktree: `blocked: unity-<reason>` (unity-verify.md §0).
inputs:
  issue: { required: false, kind: string, default: "", description: "GitHub issue number; the PR linked to it is fixed." }
  pr: { required: false, kind: string, default: "", description: "PR number. Empty: the PR linked to `issue`, else the open PR of the current branch." }
  report_from: { required: false, kind: enum, values: [review, test], default: review, description: "What to fix: review = the ❌/⚠️ points and open threads of the last unity-review; test = the compile errors and failing EditMode tests of the last unity-test comment." }
  feature: { required: false, kind: string, description: "Feature or ticket label; names the vault run folder." }
settings:
  knowledge_graph:
    enabled: false
stages:
  - name: prepare
    agent: executor
    model: haiku
    scope: { mode: stage_dir_only }
    policy:
      - "Never ask the user a question. Decide open points yourself and record them as assumptions."
      - "Read only: no commit, no push, no branch switch, no GitHub write. Do not run Unity."
    inputs:
      issue: "{{ inputs.issue }}"
      pr: "{{ inputs.pr }}"
      report_from: "{{ inputs.report_from }}"
    with:
      instructions: >
        (1) The working directory must hold Assets/ and ProjectSettings/;
        otherwise blocked. (2) `rtk gh repo view --json
        nameWithOwner,defaultBranchRef`. (3) Read .claude/unity-workflow.json
        and fill the defaults of
        ~/.claude/skills/unity-issue-workflow/references/config.md. (4) The
        PR: `pr` when given; else the PR linked to `issue`
        (references/github.md); else the open PR of the current branch. None
        found, closed or merged: blocked. (5) The issue: `issue`, else the
        `Closes #<n>` of the PR body. (6) `rtk git status --porcelain`, ignoring untracked *.meta and what the Unity Editor rewrites alone (Packages/packages-lock.json, ProjectSettings/, UserSettings/), not
        empty: blocked. The current branch must be the PR head; otherwise
        blocked (the flow checks it out). (7) What to fix, by `report_from`.
        review: the unresolved review threads (references/github.md, « Lire
        les fils non résolus »), the ❌ / ⚠️ rows of the « À corriger » list of
        the last review whose body contains `unity-review-summary` that no
        `unity-fix-summary` comment answered yet, and the general PR
        comments of a human posted after that review. test: the last PR
        comment containing `<!-- unity-test` (its compile errors: file,
        line, message; its failing EditMode tests: full name, message),
        plus the unresolved threads. Count the items
        (`open_items`, `has_open_items`). (8) Fix round: 1 + the number of PR
        comments containing `unity-fix-summary`. Write context.json with
        repo, projectRoot, baseBranch, branch (the PR head), branch_exists:
        true, issue, pr, report_from, fix_round, items [{id, kind
        thread|review-point|test-ko, ref, text, severity, file, line}],
        open_items, has_open_items, open_blocking (items of severity
        bloquant) and config.
        Memory (contract C10, templates/recipes/memory.md of the skill): with the issue number, run `rtk aidp memory context --project "<projectRoot>" --issue GH-<issue> --route code --stage fix --budget 2000` (without an issue, drop `--issue`) and save its output as memory-context.md in your stage dir, unchanged; if the command fails, write memory-context.md holding only « Mémoire indisponible : <cause> » and go on. Read the BIBLE by its index (00_INDEX) and get any passage you need with `rtk aidp rag search "<query>" --project "<projectRoot>" --source bible --budget 1500`, never whole.
    outputs: [context.json, memory-context.md]

  - name: fix
    agent: unity-review-fixer
    model: sonnet
    skills: [unity-csharp-dev]
    needs: [prepare]
    scope: { mode: repo_wide }
    policy:
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "Memory proposals: write memory-proposals.json (`{\"proposals\": []}` when nothing qualifies), 5 max, non-obvious reusable lessons only, as templates/recipes/memory.md §3 says."
      - "The PR exists: never open a new one, never merge, never mark it ready."
      - "Headless only: Unity runs in `-batchmode -nographics` in this worktree (compile gate C1, EditMode C8 of templates/recipes/unity-verify.md). Never PlayMode, never a PlaytestDriver scenario, never the Unity MCP, never computer use, never an Editor window. Never change branch."
      - "Never weaken, skip or delete a test to make it pass; a test that is wrong is fixed only with the evidence in the report and said in the summary."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      task: >
        `context.has_open_items` false: nothing to fix. Write fix.json with
        pushed false, commits [], items [], touched [], write result.json
        with the pr, branch and a summary « rien à corriger », post nothing
        on GitHub, and reply completed with signals pushed false,
        items_fixed 0, items_open 0, open_blocking 0. Otherwise fix, from
        the most serious to the least, every item of `context.items`
        (`context.report_from` says whether they come from the review or from
        a failed Unity test), within the scope of the issue and the rules of
        unity-csharp-dev, as your section « Lancé par aidp » says. For a
        `test-ko` item: a compile error is fixed at its file:line; a failing
        EditMode test is reproduced with `-testFilter`, then the code is
        fixed, never the expectation. After every batch of edits run the
        compile gate C1 and the whole EditMode suite C8 as
        templates/recipes/unity-verify.md §1-§2 say (batchmode in this
        worktree); a fix that does not compile or fails a test is not
        pushed; commit the .meta files batchmode created. Unity unusable
        (§0): reply blocked with the `unity-<reason>`. When a fix changes a
        behaviour the « Test manuel en PlayMode » section of the PR body
        describes, update that section. Commit (`fix(review|test): ... (#<issue>)`), push on the
        PR's branch (never force), reply on EACH review thread with what you
        did and the commit, resolve the fixed ones, leave a thread open with
        the reason when you did not fix it (wontfix with evidence, or
        blocked). Post ONE PR comment marked `unity-fix-summary` (round
        `context.fix_round`): the table item / status (✅ fixed, ⏸️ left) /
        evidence (commit, file:line, test), then « Reste manuel ». Items only
        PlayMode can verify go to « Reste manuel » with their T-n, not
        invented. Write fix.json: {"pushed", "commits", "items": [{id,
        status, evidence}], "fixed_refs", "touched" (the behaviours your fixes
        changed, one line each, for the next unity-test), "open_blocking",
        "compile": {ok, warnings, durationMs}, "tests": {total, failed}} and
        result.json, the file the flows read: {"pr": <number>, "branch":
        "<PR head>", "summary": "<two sentences: what was fixed, what is
        left>", "pushed": <bool>, "items_fixed": <n>, "items_open": <n>}.
        Mirror pushed, items_fixed, items_open, open_blocking as signals.
    outputs: [fix.json, result.json, memory-proposals.json]
