version: 5
id: unity-implement
description: >
  Implement a GitHub issue (or a plain-text demand) in a Unity project and
  open the draft PR, with no playtest: the review and the Unity test are
  separate pipelines of the `game-code` flow (`unity-review`, `unity-test`).
  prepare → [repro, only when track is bug] → plan → implement (code, EditMode
  tests, compile gate C1, branch, draft PR `Closes #n`) → report.

  `track: bug` inserts the `repro` stage first: write the test that reproduces
  the bug and check that it FAILS (red) on the unfixed code; the implementation
  must then turn it green. `track: standard` (default) skips it.

  Agents: planner (generic, with the unity-csharp-dev skill) and
  unity-issue-implementer. They follow unity-csharp-dev, unity-shader-hlsl for
  shaders, and the shared recipe templates/recipes/unity-verify.md of the
  skill. Verification is headless: the stages run Unity in `-batchmode
  -nographics` in the ticket's worktree, the compile gate C1 (`-quit`) then
  the EditMode suite C8 (`-runTests -testPlatform EditMode`). Never PlayMode,
  never a PlaytestDriver scenario, never the Unity MCP, never computer use:
  the PlayMode test is manual, from the « Test manuel en PlayMode » section
  the PR body carries (one T-n per CA-n). No Unity executable, another
  version than the project, no license, a timeout or an Editor already open
  on the worktree: `blocked: unity-<reason>` (unity-verify.md §0).

  Outputs read by the flows (C4): `pr` (pr.json, with the PR number), `branch`
  and `summary` (result.json of the report stage, keys pr / branch / summary).
  Never merges, never marks the PR ready.
inputs:
  issue: { required: false, kind: string, default: "", description: "GitHub issue number to implement. Empty: the demand is `prompt`." }
  prompt: { required: false, kind: string, default: "", description: "Plain-text demand when there is no GitHub issue (a local ticket body)." }
  track: { required: false, kind: enum, values: [standard, bug], default: standard, description: "bug: write the test that reproduces the bug and check it fails (stage repro) before planning. standard: straight to the plan." }
  feature: { required: false, kind: string, description: "Feature or ticket label; names the vault run folder." }
settings:
  knowledge_graph:
    enabled: false
stages:
  - name: prepare
    agent: executor
    model: haiku
    scope: { mode: stage_dir_only }
    policy:
      - "Never ask the user a question. Decide open points yourself and record them as assumptions."
      - "Read only: no commit, no push, no branch switch, no GitHub write."
    inputs:
      issue: "{{ inputs.issue }}"
      prompt: "{{ inputs.prompt }}"
      track: "{{ inputs.track }}"
    with:
      instructions: >
        Prepare the run as section 1 of
        ~/.claude/skills/unity-issue-workflow/SKILL.md does, without asking
        anything. (1) The working directory must hold Assets/ and
        ProjectSettings/; otherwise report blocked. (2) `rtk gh auth status`,
        then `rtk gh repo view --json nameWithOwner,defaultBranchRef`. (3)
        Read .claude/unity-workflow.json and fill the defaults of
        ~/.claude/skills/unity-issue-workflow/references/config.md; absent
        file means all defaults. (4) With an `issue`, `rtk gh issue view`; a
        closed issue is blocked. With neither `issue` nor `prompt`, blocked.
        (5) `rtk git status --porcelain`, ignoring untracked *.meta and what the Unity Editor rewrites alone (Packages/packages-lock.json, ProjectSettings/, UserSettings/), not empty is blocked. (6) Branch:
        when the current branch differs from the base branch, keep it
        (`branch_exists: true`); otherwise derive `<prefix><n>-<slug>` from
        branchPrefixes and the issue labels, the slug being the title (or the
        prompt's first line) in ASCII kebab-case, 40 characters at most. (7)
        Look for a PR already linked to the issue (references/github.md) and
        record it, or null. (8) Do NOT compile or run Unity here: the Unity stages do, in
        batchmode. Record the Unity executable and the project version as
        templates/recipes/unity-verify.md §0.2 resolves them (`unity_editor`,
        null when not found, `unity_version`). Write context.json with repo,
        projectRoot (absolute), baseBranch, branch, branch_exists, issue,
        prompt, track, pr (number or null), unity_editor, unity_version and
        config (defaults filled in).
        Memory (contract C10, templates/recipes/memory.md of the skill): with the issue number, run `rtk aidp memory context --project "<projectRoot>" --issue GH-<issue> --route code --stage plan --budget 2000` (without an issue, drop `--issue`) and save its output as memory-context.md in your stage dir, unchanged; if the command fails, write memory-context.md holding only « Mémoire indisponible : <cause> » and go on. Read the BIBLE by its index (00_INDEX) and get any passage you need with `rtk aidp rag search "<query>" --project "<projectRoot>" --source bible --budget 1500`, never whole.
    outputs: [context.json, memory-context.md]

  # Bug track only: the failing test comes before any plan or fix. A skipped
  # stage leaves `repro` empty for the plan and the implementer.
  - name: repro
    agent: unity-issue-implementer
    model: sonnet
    needs: [prepare]
    scope: { mode: repo_wide }
    when: "{{ inputs.track == 'bug' }}"
    policy:
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "Write the reproduction test ONLY: never touch the code under test, never fix the bug."
      - "Commit locally on the run's branch (`test(repro): ...`) but do NOT push and do NOT open a PR: the implement stage does."
      - "Headless only: Unity runs in `-batchmode -nographics` in this worktree (compile gate C1, EditMode C8 of templates/recipes/unity-verify.md). Never PlayMode, never a PlaytestDriver scenario, never the Unity MCP, never an Editor window."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      task: >
        Reproduce the bug of the demand of `context` (the issue via `rtk gh
        issue view <issue> --repo <repo> --comments`, else `prompt`). Create
        the branch `context.branch` when `context.branch_exists` is false
        (from the base branch), as your section « Lancé par aidp » says. Read
        the code the bug touches, then write ONE focused test that encodes
        the correct behaviour and so fails today: an EditMode test under the
        testsRoot of the config, on the service, model or pure logic the
        bug lives in (a bug that only shows in PlayMode gets the EditMode
        test closest to its logic, and a manual T-n for the rest, said in
        repro.json `manual_only`). Run it as templates/recipes/unity-verify.md
        says (compile gate C1, then C8 with `-testFilter` on that test) and
        check that it is RED for the right reason: the assertion on the
        buggy behaviour, not a compile error, a missing setup or an
        unrelated exception. Not red (the bug does not reproduce, or the
        test cannot be made to fail for the right reason after two
        attempts): do not commit anything, reply blocked with « blocked:
        no-repro » in the summary, the evidence in repro.json and the reason
        in signals.blocked_reason. Red: commit the test and its .meta
        locally. Unity unusable (§0): reply blocked with the `unity-<reason>`.
        Write repro.json: {"test": "<fully qualified name>", "file":
        "<path>", "kind": "editmode", "red": true, "failure": "<the failing
        assertion message>", "commit": "<sha>", "manual_only": "<what only
        PlayMode shows, or null>", "compile": {ok, warnings, durationMs}}.
        Mirror red as signals.red.
    outputs: [repro.json]

  # Plan before code: the planner reads the issue, the contextDocs and the code it touches and writes
  # the implementation plan the implementer follows, plus the manual PlayMode test the PR body carries
  # for the human.
  - name: plan
    agent: planner
    model: opus
    skills: [unity-csharp-dev]
    needs: [prepare, repro]
    scope: { mode: stage_dir_only }
    with: { mode: feature }
    policy:
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "Never ask the user a question. Decide open points yourself and record them in the plan's Assumptions section."
      - "Read only: no commit, no push, no branch switch, no GitHub write, no file written outside the stage dir."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      repro: "{{ stages.repro.outputs.repro }}"
      instructions: >
        Plan the implementation of the demand of `context` (the issue via
        `rtk gh issue view <issue> --repo <repo> --comments`, else `prompt`)
        in this Unity project. `repro`, when its file exists (bug track only), is the failing
        test of the bug track: the plan's goal is to turn it green without
        weakening it. Read the contextDocs of the config that touch the
        subject, then the code the demand touches and its neighbours (scopes,
        services, views, configs, ScriptableObjects, tests under testsRoot).
        Follow the unity-csharp-dev skill (layers
        Model → Config → Repository → Service → Presenter → View → Scope,
        VContainer, no magic values, tunable values in ScriptableObjects)
        and, for shader work,
        ~/.claude/skills/unity-shader-hlsl/SKILL.md. An issue written with
        the github-issue-ticket template (sections « Description technique »,
        CA-n, T-n): its Files table, signatures and values are the plan's
        frame, « Hors périmètre » is forbidden. Write plan.md in the language
        of config.language with these sections: (1) Critères d'acceptation —
        every CA-n (or the criteria the text implies), each with how it will
        be met, and flag the ones the issue marks `needs-feel-check`; (2)
        Fichiers — table path / create|modify / role, in implementation
        order, every new file under Assets/ noted as needing its .meta; (3)
        Étapes — ordered, one verifiable change each, citing the existing
        code to reuse with its path; (4) Tests EditMode — one per behaviour
        of each service created or modified, with test name, data and
        expected result (and the T-n it covers); (5) Test manuel en PlayMode
        — for every CA-n an EditMode test cannot prove, one T-n in three
        lines: scene or arena to open, actions (keyboard or gamepad),
        observable expected result; reuse the T-n of the issue when they fit,
        and say which CA-n need no PlayMode because section 4 proves them.
        Nothing automated plays the game: no probe, no scenario, no
        PlaytestDriver; (6) Actions
        manuelles dans l'éditeur — what only the Editor can do (assign a
        reference, create a ScriptableObject asset, add a component or
        LifetimeScope to a scene), each doable in one minute; (7) Risques et
        hypothèses. No plan.json: Unity has one Editor per project, the
        implementation runs as one stage.
    outputs: [plan.md]

  - name: implement
    agent: unity-issue-implementer
    model: opus
    needs: [plan]
    scope: { mode: repo_wide }
    policy:
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "Headless only: Unity runs in `-batchmode -nographics` in this worktree (compile gate C1, EditMode C8 of templates/recipes/unity-verify.md). Never PlayMode, never a PlaytestDriver scenario, never the Unity MCP, never computer use, never an Editor window."
      - "Never change branch."
      - "Never mark the PR ready, never merge."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      plan: "{{ stages.plan.outputs.plan }}"
      repro: "{{ stages.repro.outputs.repro }}"
      task: >
        Implement the demand of `context` and open the draft PR, as your
        section « Lancé par aidp » says. Follow `plan` (plan.md): its files,
        order, EditMode tests, manual PlayMode tests and manual actions are
        your plan; a deviation is an assumption with its reason. When `repro` is not
        empty (bug track), its test is already committed on the branch: the
        fix must turn it green, never edit or delete it to pass, and report
        its result in implementation.json. Verify with the compile gate C1
        and the whole EditMode suite C8 as templates/recipes/unity-verify.md
        §1-§2 say (batchmode in this worktree); fix every error and every
        failing test before the PR; commit the .meta files batchmode
        created. Unity unusable (§0): reply blocked with the
        `unity-<reason>` in the summary and signals.blocked_reason. The PR is
        a DRAFT, its body ends with `Closes #<issue>` when there is an
        issue, and holds the sections « Description », « Critères
        d'acceptation » (CA-n with where it is met), « Vérification »
        (compile gate C1 result, EditMode counts, the Unity version),
        « Actions manuelles dans l'éditeur » and « Test manuel en PlayMode »
        (the T-n table of the plan: T-n → CA-n, scene, actions, expected
        result; the human plays it before the merge). Nothing in the PR
        claims a PlayMode result: nobody played it yet. When `context.pr` is set, the PR
        exists: commit and push on its branch and update its body instead of
        opening a new one. pr.json carries number, url, branch and
        summary (one sentence on what was implemented). Reply completed with
        signals pr (the number), branch.
    outputs: [pr.json, implementation.json]

  - name: report
    agent: executor
    model: haiku
    needs: [implement]
    scope: { mode: stage_dir_only }
    policy:
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "No GitHub write, no commit, no push. Never merge, never mark the PR ready."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      plan: "{{ stages.plan.outputs.plan }}"
      repro: "{{ stages.repro.outputs.repro }}"
      implementation: "{{ stages.implement.outputs.implementation }}"
      pr: "{{ stages.implement.outputs.pr }}"
    with:
      instructions: >
        Write report.md: PR link (draft), acceptance criteria covered (from
        the plan and implementation.json), the compile gate C1 and EditMode
        results that really ran (batchmode), the reproduction test and its
        red → green result when the `repro` file exists, manual actions in
        the Editor, the manual PlayMode tests left to the human, the
        implementer's assumptions, and the next step: `unity-review` on this
        PR. Also write result.json, the file the flows read:
        {"pr": <PR number>, "branch": "<PR head branch>", "summary": "<two
        sentences: what was implemented, what is verified>", "track":
        "<standard|bug>", "compile_ok": <bool>, "editmode_failed": <n>,
        "repro_green": <bool or null when no repro>}. Mirror pr and branch
        as signals.
    outputs: [report.md, result.json]
