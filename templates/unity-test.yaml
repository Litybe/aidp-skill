version: 5
id: unity-test
description: >
  Headless verification of the PR of a Unity issue, in the ticket's worktree,
  with no Editor open, no PlayMode, no screenshot and no computer use:
  prepare → test. The test stage runs Unity in batchmode twice: the compile
  gate C1 (`-quit`), then the whole EditMode suite C8 (`-runTests
  -testPlatform EditMode`), as templates/recipes/unity-verify.md says. It
  then posts ONE PR comment marked `<!-- unity-test round=n -->` with the
  compile result, the EditMode counts and failures, and the check-list « À
  tester à la main en PlayMode » copied from the PR body (section « Test
  manuel en PlayMode », one T-n per CA-n): the human plays it before the
  merge. The pipeline never plays the game: PlayMode is manual.

  Outputs read by the flows (C4): `passed` (boolean) and `report` (the
  Markdown test report), via result.json. A failed compile gate or a failing
  EditMode test is NOT a block: passed false, and the flow runs `unity-fix`
  with `report_from: test`. No Unity executable, another version than the
  project, no license, a timeout or an Editor already open on the worktree:
  `blocked: unity-<reason>` (unity-verify.md §0).

  The stage edits nothing, commits nothing and pushes nothing: the flow step
  declares `pushes: false`. No `unity-editor` resource is needed.

  Agent: executor. Shared recipe: templates/recipes/unity-verify.md.
inputs:
  issue: { required: false, kind: string, default: "", description: "GitHub issue number; its linked PR is tested." }
  pr: { required: false, kind: string, default: "", description: "PR number. Empty: the PR linked to `issue`, else the open PR of the current branch." }
  feature: { required: false, kind: string, description: "Feature or ticket label; names the vault run folder." }
settings:
  knowledge_graph:
    enabled: false
stages:
  - name: prepare
    agent: executor
    model: haiku
    scope: { mode: stage_dir_only }
    policy:
      - "Never ask the user a question. Decide open points yourself and record them as assumptions."
      - "Read only: no commit, no push, no branch switch, no GitHub write. Do not run Unity."
    inputs:
      issue: "{{ inputs.issue }}"
      pr: "{{ inputs.pr }}"
    with:
      instructions: >
        (1) The working directory must hold Assets/ and ProjectSettings/;
        otherwise blocked. (2) `rtk gh repo view --json
        nameWithOwner,defaultBranchRef`. (3) Read .claude/unity-workflow.json
        and fill the defaults of
        ~/.claude/skills/unity-issue-workflow/references/config.md. (4) The
        PR: `pr` when given; else the PR linked to `issue`
        (references/github.md); else the open PR of the current branch. None
        found, closed or merged: blocked. (5) The issue: `issue`, else the
        `Closes #<n>` of the PR body. (6) `rtk git status --porcelain`,
        ignoring untracked *.meta and what Unity rewrites alone
        (Packages/packages-lock.json, ProjectSettings/, UserSettings/), not
        empty is blocked. The current branch must be the PR head; otherwise
        blocked (the flow checks it out). (7) The criteria: every `CA-n` of
        the issue with its text, and the T-n scenarios of the issue. (8) The
        manual tests: the rows of the « Test manuel en PlayMode » section of
        the PR body (T-n → CA-n, scene, actions, expected result); an empty
        or missing section is `manual_tests_missing: true`. (9) The test
        round: 1 + the number of PR comments containing `<!-- unity-test`.
        (10) The Unity executable, as templates/recipes/unity-verify.md §0.2
        resolves it, and the project version of
        ProjectSettings/ProjectVersion.txt; not found is NOT blocked here:
        record `unity_editor: null` and the test stage reports it. Write
        context.json with repo, projectRoot, baseBranch, branch, issue, pr,
        test_round, criteria [{id, text}], manual_tests [{id, criterion,
        scene, actions, expected}], manual_tests_missing, unity_editor,
        unity_version and config.
        Memory (contract C10, templates/recipes/memory.md of the skill): with the issue number, run `rtk aidp memory context --project "<projectRoot>" --issue GH-<issue> --route code --stage test --budget 2000` (without an issue, drop `--issue`) and save its output as memory-context.md in your stage dir, unchanged; if the command fails, write memory-context.md holding only « Mémoire indisponible : <cause> » and go on. Read the BIBLE by its index (00_INDEX) and get any passage you need with `rtk aidp rag search "<query>" --project "<projectRoot>" --source bible --budget 1500`, never whole.
    outputs: [context.json, memory-context.md]

  - name: test
    agent: executor
    model: sonnet
    needs: [prepare]
    scope: { mode: repo_wide }
    policy:
      - "Memory: input `memory` = C10 memory block; apply it, fetch more with `rtk aidp rag search`, never read the BIBLE or code whole, cite `path:Lx-Ly`. Memory unavailable: go on and say so in the report. Rules: templates/recipes/memory.md."
      - "Memory proposals: write memory-proposals.json (`{\"proposals\": []}` when nothing qualifies), 5 max, non-obvious reusable lessons only, as templates/recipes/memory.md §3 says."
      - "Never edit game code, a test, a scene, a prefab or an asset; never commit, never push, never change branch. Restore any file Unity rewrote (`rtk git restore`)."
      - "Headless only: Unity runs in `-batchmode -nographics` in this worktree, twice at most per request (compile gate, then EditMode). Never `-testPlatform PlayMode`, never a PlaytestDriver scenario, never the Unity MCP, never computer use, never an Editor window."
      - "The only GitHub write allowed is ONE `rtk gh pr comment` per run."
    inputs:
      context: "{{ stages.prepare.outputs.context }}"
      memory: "{{ stages.prepare.outputs.memory-context }}"
      task: >
        Verify the PR `context.pr` headless, in this worktree, following
        templates/recipes/unity-verify.md to the letter. (0) Prerequisites
        (§0): `context.unity_editor` null, or its version differs from
        `context.unity_version`, or an Editor is open on projectRoot: reply
        blocked with « blocked: unity-<reason> » in the summary and the
        reason in signals.blocked_reason, nothing posted. (1) Compile gate
        C1 (§1), one request: errors mean the verification stops there,
        passed false, with the error list (file:line, message). (2) The
        whole EditMode suite C8 (§2), one request, no filter: a failing test
        is evidence, not a stop. (3) Verdict: passed is true only when the
        compile gate is ok and no EditMode test failed (`no-tests` counts as
        ok, and is said). (4) Post ONE PR comment starting with `<!--
        unity-test round=<test_round> -->` then « ## Test Unity headless —
        tour <n> : passed | failed », the compile gate result (ok, warnings,
        duration, or the error table file:line / message), the EditMode
        counts (total, passed, failed, skipped) and the failure table (test /
        message), then « ## À tester à la main en PlayMode avant le merge »:
        one check-box line per `context.manual_tests` row (T-n → CA-n :
        scene, actions, expected result); when `manual_tests_missing`, say
        so in that section and list the CA-n the EditMode suite does not
        prove, so the human writes the procedure before merging. (5) Write
        test-report.md (the same content as the comment plus the paths of
        the logs and JSON files in your stage dir), verification.json
        {"round", "passed", "compile": {ok, errors, warnings, durationMs,
        requestId}, "editmode": {total, passed, failed, skipped, failures,
        requestId}, "manual_tests": [ids], "manual_tests_missing",
        "comment_url"} and result.json, the file the flows read:
        {"passed": <bool>, "report": "test-report.md", "round": <n>,
        "failed": [compile error ids `file:line` or failing test full
        names], "manual_tests": [ids], "comment_url": "<url>"}. Reply
        completed; mirror passed, round and failed (a count) as signals.
    outputs: [verification.json, test-report.md, result.json, memory-proposals.json]
